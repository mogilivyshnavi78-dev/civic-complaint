                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 6. COMPLAINT DETAILS PAGE
    // ==========================================
    function ComplaintDetailsPage({ complaintId, currentUser, token, navigate, showToast }) {
      const [complaint, setComplaint] = useState(null);
      const [loading, setLoading] = useState(true);
      const [newStatus, setNewStatus] = useState('');
      const [statusNotes, setStatusNotes] = useState('');
      const [actionLoading, setActionLoading] = useState(false);

      const fetchDetails = async () => {
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/staff/complaints/${complaintId}`);
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to load details');
          setComplaint(data.complaint);
          setNewStatus(data.complaint.status);
        } catch (e) {
          showToast(e.message, 'error');
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        if (complaintId) {
          fetchDetails();
        }
      }, [complaintId]);

      // Quick Action: Verify Complaint
      const handleVerify = async () => {
        setActionLoading(true);
        try {
          const authTok = token || localStorage.getItem('token');
          const res = await fetch(`${API_BASE}/complaints/${complaintId}/verify`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              ...(authTok ? { 'Authorization': `Bearer ${authTok}` } : {})
            },
            body: JSON.stringify({
              notes: statusNotes || 'Grievance verified by official municipal review.'
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to verify complaint');
          showToast(data.message, 'success');
          setStatusNotes('');
          fetchDetails();
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setActionLoading(false);
        }
      };

      // Quick Action: Reject Complaint
      const handleReject = async () => {
        setActionLoading(true);
        try {
          const authTok = token || localStorage.getItem('token');
          const res = await fetch(`${API_BASE}/complaints/${complaintId}/status`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              ...(authTok ? { 'Authorization': `Bearer ${authTok}` } : {})
            },
            body: JSON.stringify({
              status: 'Rejected',
              notes: statusNotes || 'Complaint rejected after official staff review.',
              changed_by: currentUser?.name || 'Municipal Officer'
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to reject complaint');
          showToast(data.message, 'success');
          setStatusNotes('');
          fetchDetails();
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setActionLoading(false);
        }
      };

      // Status Update Action
      const handleStatusSubmit = async (e) => {
        e.preventDefault();
        setActionLoading(true);
        try {
          const authTok = token || localStorage.getItem('token');
          const res = await fetch(`${API_BASE}/staff/complaints/${complaintId}/status`, {
            method: 'PATCH',
            headers: {
              'Content-Type': 'application/json',
              ...(authTok ? { 'Authorization': `Bearer ${authTok}` } : {})
            },
            body: JSON.stringify({
              status: newStatus,
              notes: statusNotes,
              changed_by: currentUser?.name || 'Municipal Officer'
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to update status');

          showToast(data.message, 'success');
          setStatusNotes('');
          fetchDetails();
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setActionLoading(false);
        }
      };

      // Duplicate Link Action
      const handleDuplicateToggle = async (isDuplicate, dupOfId, sim) => {
        try {
          const authTok = token || localStorage.getItem('token');
          const res = await fetch(`${API_BASE}/staff/complaints/${complaintId}/duplicate`, {
            method: 'PATCH',
            headers: {
              'Content-Type': 'application/json',
              ...(authTok ? { 'Authorization': `Bearer ${authTok}` } : {})
            },
            body: JSON.stringify({
              is_duplicate: isDuplicate ? 1 : 0,
              duplicate_of_id: dupOfId || null,
              duplicate_similarity: sim || 0.0
            })
          });
          const data = await res.json();
          showToast(data.message, 'success');
          fetchDetails();
        } catch (e) {
          showToast('Failed to update duplicate flag', 'error');
        }
      };

      if (loading) {
        return (
          <div className="text-center py-20 text-slate-400">
            <LucideIcon name="refresh" className="w-8 h-8 animate-spin mx-auto mb-2 text-blue-500" />
            <p className="text-sm">Loading Complaint Dossier...</p>
          </div>
        );
      }

      if (!complaint) {
        return (
          <div className="bg-white rounded-2xl p-10 text-center max-w-md mx-auto border border-slate-200">
            <h3 className="text-lg font-bold text-slate-800 mb-2">Complaint Not Found</h3>
            <p className="text-xs text-slate-500 mb-4">No record found with ID {complaintId}.</p>
            <button
              onClick={() => navigate('dashboard')}
              className="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold"
            >
              Back to Dashboard
            </button>
          </div>
        );
      }

      return (
        <div className="space-y-6 animate-fade-in">
          {/* Top Return Bar */}
          <div className="flex items-center justify-between pb-4 border-b border-slate-200">
            <button
              onClick={() => navigate('dashboard')}
              className="flex items-center gap-2 text-xs font-bold text-slate-600 hover:text-blue-600 transition-colors"
            >
              <LucideIcon name="arrowLeft" className="w-4 h-4" />
              <span>Back to Staff Dashboard</span>
            </button>

            <div className="flex items-center gap-2">
              <span className="font-mono font-bold text-blue-700">{complaint.complaint_id}</span>
              <span className={`text-xs font-bold px-2.5 py-0.5 rounded-full border ${getStatusBadge(complaint.status)}`}>
                {complaint.status}
              </span>
              <span className={`text-xs font-bold px-2.5 py-0.5 rounded-full ${getPriorityBadge(complaint.priority)}`}>
                {complaint.priority} ({complaint.priority_score} pts)
              </span>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            {/* LEFT 8 COLS: COMPLAINT INFORMATION & AI DOSSIER */}
            <div className="lg:col-span-8 space-y-6">
              {/* Core Information Card */}
              <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs space-y-4">
                <div>
                  <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Grievance Subject</span>
                  <h3 className="text-xl font-bold text-slate-900 mt-1">{complaint.title}</h3>
                  <div className="text-xs text-slate-500 mt-1 flex flex-wrap gap-4">
                    <span>📍 {complaint.location}</span>
                    {complaint.landmark && <span>🏛️ Near: {complaint.landmark}</span>}
                    <span>👤 Reported by: {complaint.citizen_name || 'Citizen'} ({complaint.citizen_email || 'N/A'})</span>
                  </div>
                </div>

                <div>
                  <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Citizen Statement</span>
                  <p className="text-xs sm:text-sm text-slate-800 leading-relaxed bg-slate-50 p-4 rounded-xl border border-slate-200">
                    {complaint.description}
                  </p>
                </div>

                {/* Evidence Image */}
                <div>
                  <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Evidence Photo</span>
                  {complaint.image_url ? (
                    <div className="rounded-xl overflow-hidden border border-slate-200 shadow-xs max-h-72">
                      <img src={complaint.image_url} alt="Evidence" className="w-full h-full object-cover" />
                    </div>
                  ) : (
                    <div className="bg-slate-50 rounded-xl border border-dashed border-slate-200 p-4 text-center text-slate-400 text-xs">
                      No photographic proof attached
                    </div>
                  )}
                </div>
              </div>

              {/* AI Priority Breakdown Card */}
              <div className="bg-gradient-to-br from-slate-900 to-civic-950 text-white rounded-2xl p-6 border border-slate-800 shadow-md">
                <div className="flex justify-between items-center mb-3 border-b border-slate-800 pb-2">
                  <span className="font-bold text-xs uppercase tracking-wider text-blue-300">
                    🤖 Explainable AI Priority Engine
                  </span>
                  <span className="font-mono text-xs font-bold text-emerald-400">
                    Score: {complaint.priority_score} / 100
                  </span>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs font-mono mb-3">
                  <div className="bg-slate-800/80 p-2.5 rounded-lg border border-slate-700">
                    <span className="text-[10px] text-slate-400 block">Safety Risk (35)</span>
                    <span className="font-bold text-red-400 text-sm">{complaint.safety_score} pts</span>
                  </div>
                  <div className="bg-slate-800/80 p-2.5 rounded-lg border border-slate-700">
                    <span className="text-[10px] text-slate-400 block">Severity (25)</span>
                    <span className="font-bold text-amber-400 text-sm">{complaint.severity_score} pts</span>
                  </div>
                  <div className="bg-slate-800/80 p-2.5 rounded-lg border border-slate-700">
                    <span className="text-[10px] text-slate-400 block">Public Impact (25)</span>
                    <span className="font-bold text-blue-400 text-sm">{complaint.impact_score} pts</span>
                  </div>
                  <div className="bg-slate-800/80 p-2.5 rounded-lg border border-slate-700">
                    <span className="text-[10px] text-slate-400 block">Waiting Time (15)</span>
                    <span className="font-bold text-purple-400 text-sm">{complaint.waiting_score} pts</span>
                  </div>
                </div>

                <p className="text-[11px] text-slate-300 italic leading-relaxed">
                  "{complaint.priority_reason}"
                </p>
              </div>

              {/* DUPLICATE DETECTION RESULT & REVIEW PANEL */}
              <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
                <div className="flex justify-between items-center mb-3">
                  <span className="text-xs font-bold text-slate-800 uppercase tracking-wider flex items-center gap-1.5">
                    <LucideIcon name="search" className="w-4 h-4 text-purple-600" />
                    <span>TF-IDF Duplicate Detection Result</span>
                  </span>
                  {complaint.is_duplicate ? (
                    <button
                      onClick={() => handleDuplicateToggle(false, null, 0)}
                      className="text-[11px] bg-slate-100 border border-slate-300 text-slate-700 px-2.5 py-1 rounded-md hover:bg-slate-200"
                    >
                      Dismiss Duplicate Link
                    </button>
                  ) : null}
                </div>

                {complaint.duplicate_analysis?.matches?.length > 0 ? (
                  <div className="space-y-3">
                    <p className="text-xs text-slate-500">
                      Top matching complaints identified in this sector based on cosine similarity of text and geographic tokens:
                    </p>
                    {complaint.duplicate_analysis.matches.map(m => (
                      <div key={m.complaint_id} className="bg-slate-50 p-3.5 rounded-xl border border-slate-200 flex flex-col sm:flex-row justify-between sm:items-center gap-2 text-xs">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="font-mono font-bold text-blue-700">{m.complaint_id}</span>
                            <span className="font-semibold text-slate-800">{m.title}</span>
                          </div>
                          <div className="text-[11px] text-slate-400">📍 {m.location} • Status: {m.status}</div>
                        </div>
                        <div className="flex items-center gap-3">
                          <span className="font-mono font-bold text-purple-700 bg-purple-50 px-2 py-0.5 rounded border border-purple-200">
                            {m.similarity_percentage}% Match
                          </span>
                          <button
                            onClick={() => handleDuplicateToggle(true, m.complaint_id, m.similarity_percentage)}
                            className="bg-purple-600 hover:bg-purple-700 text-white font-semibold px-2.5 py-1 rounded text-[11px]"
                          >
                            Link as Duplicate
                          </button>
                        </div>
                      </div>
                    ))}
                    <p className="text-[11px] text-slate-400 italic">
                      Notice: Complaints are not automatically deleted. Municipal staff maintains authority to merge work orders.
                    </p>
                  </div>
                ) : (
                  <p className="text-xs text-slate-500 italic">
                    No high-similarity duplicate complaints detected for this report.
                  </p>
                )}
              </div>

              {/* AUDIT LOG TIMELINE */}
              <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
                <span className="text-xs font-bold text-slate-700 uppercase tracking-wider block mb-4">Complete Audit Log History</span>
                <div className="space-y-3">
                  {complaint.history?.map((h, i) => (
                    <div key={i} className="text-xs p-3.5 bg-slate-50 rounded-xl border border-slate-200 flex justify-between items-start">
                      <div>
                        <span className="font-bold text-slate-800">{h.new_status}</span> by {h.changed_by}
                        {h.notes && <p className="text-slate-500 italic mt-0.5">"{h.notes}"</p>}
                      </div>
                      <span className="text-[11px] text-slate-400 font-mono">{h.created_at}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* RIGHT 4 COLS: ACTION PANEL */}
            <div className="lg:col-span-4 sticky top-24 space-y-5">
              {/* QUICK ACTION BUTTONS: VERIFY & REJECT */}
              <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
                <span className="text-xs font-bold text-slate-900 uppercase tracking-wider block">
                  Official Verification Actions
                </span>
                <p className="text-[11px] text-slate-500">
                  Quick municipal officer triage actions:
                </p>
                <div className="grid grid-cols-2 gap-2.5">
                  <button
                    type="button"
                    onClick={handleVerify}
                    disabled={actionLoading || complaint.status === 'Verified'}
                    className={`py-2.5 px-3 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 transition-all shadow-sm ${
                      complaint.status === 'Verified'
                        ? 'bg-emerald-100 text-emerald-800 border border-emerald-300 cursor-not-allowed opacity-80'
                        : 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-emerald-200'
                    }`}
                  >
                    <LucideIcon name="checkCircle" className="w-4 h-4" />
                    {complaint.status === 'Verified' ? 'Already Verified' : 'Verify Complaint'}
                  </button>

                  <button
                    type="button"
                    onClick={handleReject}
                    disabled={actionLoading || complaint.status === 'Rejected'}
                    className={`py-2.5 px-3 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 transition-all shadow-sm ${
                      complaint.status === 'Rejected'
                        ? 'bg-rose-100 text-rose-800 border border-rose-300 cursor-not-allowed opacity-80'
                        : 'bg-rose-600 hover:bg-rose-700 text-white shadow-rose-200'
                    }`}
                  >
                    <LucideIcon name="alertCircle" className="w-4 h-4" />
                    {complaint.status === 'Rejected' ? 'Already Rejected' : 'Reject Complaint'}
                  </button>
                </div>
              </div>

              {/* CUSTOM STATUS UPDATE & REMARKS */}
              <form onSubmit={handleStatusSubmit} className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
                <span className="text-xs font-bold text-slate-900 uppercase tracking-wider block">
                  Update Resolution Status
                </span>

                <div className="space-y-2">
                  <label className="block text-[11px] font-bold text-slate-500 uppercase">Select New Status</label>
                  <div className="grid grid-cols-2 gap-2">
                    {['Pending', 'Verified', 'In Progress', 'Resolved', 'Rejected'].map(st => (
                      <button
                        key={st}
                        type="button"
                        onClick={() => setNewStatus(st)}
                        className={`py-2 px-3 rounded-lg text-xs font-bold transition-all border ${
                          newStatus === st ? 'bg-blue-600 text-white border-blue-700 shadow-sm' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                        }`}
                      >
                        {st}
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">
                    Inspector Remarks / Work Order Notes
                  </label>
                  <textarea
                    rows="3"
                    placeholder="e.g. Field inspection completed, work order #849 issued..."
                    value={statusNotes}
                    onChange={(e) => setStatusNotes(e.target.value)}
                    className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500"
                  ></textarea>
                </div>

                <button
                  type="submit"
                  disabled={actionLoading}
                  className="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-2.5 rounded-xl text-xs shadow-md transition-all flex items-center justify-center gap-1.5"
                >
                  <LucideIcon name="refresh" className="w-3.5 h-3.5" />
                  {actionLoading ? 'Updating...' : 'Update Status & Remarks'}
                </button>
              </form>

              {/* Quick Metadata Box */}
              <div className="bg-slate-100 rounded-2xl p-4 text-xs text-slate-600 space-y-2">
                <div className="flex justify-between">
                  <span className="text-slate-400">Predicted Category:</span>
                  <span className="font-bold text-slate-800">{complaint.predicted_category}</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-400">NLP Confidence:</span>
                  <span className="font-mono font-bold text-slate-800">{complaint.category_confidence}%</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-400">Submission Timestamp:</span>
                  <span className="font-mono text-slate-700">{complaint.created_at}</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 7. ANALYTICS PAGE (CHART.JS)
    // ==========================================
    function AnalyticsPage({ showToast }) {
      const [summary, setSummary] = useState(null);
      const [chartData, setChartData] = useState(null);
      const [loading, setLoading] = useState(true);

      const categoryChartRef = useRef(null);
      const priorityChartRef = useRef(null);
      const statusChartRef = useRef(null);
      const monthlyChartRef = useRef(null);

      const categoryInstance = useRef(null);
      const priorityInstance = useRef(null);
      const statusInstance = useRef(null);
      const monthlyInstance = useRef(null);

      const loadAnalytics = async () => {
        setLoading(true);
        try {
          const [sumRes, chartRes] = await Promise.all([
            fetch(`${API_BASE}/analytics/summary`),
            fetch(`${API_BASE}/analytics/charts`)
          ]);
          const sumData = await sumRes.json();
          const cData = await chartRes.json();
          setSummary(sumData);
          setChartData(cData);
        } catch (e) {
          showToast('Failed to load chart analytics', 'error');
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        loadAnalytics();
      }, []);

      useEffect(() => {
        if (!chartData) return;

        // 1. Complaints by Category (Doughnut)
        if (categoryChartRef.current) {
          if (categoryInstance.current) categoryInstance.current.destroy();
          const ctx = categoryChartRef.current.getContext('2d');
          categoryInstance.current = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: chartData.categories.labels,
              datasets: [{
                data: chartData.categories.data,
                backgroundColor: [
                  '#2563eb', // Road Damage
                  '#10b981', // Garbage Accumulation
                  '#06b6d4', // Water Leakage
                  '#8b5cf6', // Blocked Drainage
                  '#f59e0b', // Broken Streetlights
                ],
                borderWidth: 2,
                borderColor: '#ffffff'
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } }
            }
          });
        }

        // 2. Complaints by Priority (Bar)
        if (priorityChartRef.current) {
          if (priorityInstance.current) priorityInstance.current.destroy();
          const ctx = priorityChartRef.current.getContext('2d');
          priorityInstance.current = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: chartData.priorities.labels,
              datasets: [{
                label: 'Complaints',
                data: chartData.priorities.data,
                backgroundColor: [
                  '#ef4444', // Critical
                  '#f97316', // High
                  '#f59e0b', // Medium
                  '#3b82f6', // Low
                ],
                borderRadius: 8
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                y: { beginAtZero: true, grid: { color: '#f1f5f9' }, ticks: { stepSize: 1 } },
                x: { grid: { display: false } }
              }
            }
          });
        }

        // 3. Pending vs Resolved Pipeline (Polar Area)
        if (statusChartRef.current) {
          if (statusInstance.current) statusInstance.current.destroy();
          const ctx = statusChartRef.current.getContext('2d');
          statusInstance.current = new Chart(ctx, {
            type: 'polarArea',
            data: {
              labels: chartData.statuses.labels,
              datasets: [{
                data: chartData.statuses.data,
                backgroundColor: [
                  'rgba(245, 158, 11, 0.7)', // Pending
                  'rgba(59, 130, 246, 0.7)',  // Verified
                  'rgba(139, 92, 246, 0.7)',  // In Progress
                  'rgba(16, 185, 129, 0.7)',  // Resolved
                  'rgba(244, 63, 94, 0.7)',   // Rejected
                ]
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } }
            }
          });
        }

        // 4. Monthly Complaints Chart (Line)
        if (monthlyChartRef.current) {
          if (monthlyInstance.current) monthlyInstance.current.destroy();
          const ctx = monthlyChartRef.current.getContext('2d');
          monthlyInstance.current = new Chart(ctx, {
            type: 'line',
            data: {
              labels: chartData.monthly.labels,
              datasets: [
                {
                  label: 'Registered Complaints',
                  data: chartData.monthly.submitted,
                  borderColor: '#2563eb',
                  backgroundColor: 'rgba(37, 99, 235, 0.1)',
                  fill: true,
                  tension: 0.35,
                  pointRadius: 4
                },
                {
                  label: 'Resolved Issues',
                  data: chartData.monthly.resolved,
                  borderColor: '#10b981',
                  backgroundColor: 'rgba(16, 185, 129, 0.1)',
                  fill: true,
                  tension: 0.35,
                  pointRadius: 4
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } } },
              scales: {
                y: { beginAtZero: true, grid: { color: '#f1f5f9' }, ticks: { stepSize: 2 } },
                x: { grid: { display: false } }
              }
            }
          });
        }

        return () => {
          if (categoryInstance.current) categoryInstance.current.destroy();
          if (priorityInstance.current) priorityInstance.current.destroy();
          if (statusInstance.current) statusInstance.current.destroy();
          if (monthlyInstance.current) monthlyInstance.current.destroy();
        };
      }, [chartData]);

      return (
        <div className="space-y-8 animate-fade-in">
          <div className="flex justify-between items-center">
            <div>
              <div className="flex items-center gap-2">
                <LucideIcon name="barChart" className="w-5 h-5 text-blue-600" />
                <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Municipal Intelligence & Analytics</h2>
              </div>
              <p className="text-xs text-slate-500 mt-1">
                Real-time grievance distributions, resolution velocity, and monthly trends
              </p>
            </div>

            <button
              onClick={loadAnalytics}
              className="bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 font-semibold px-4 py-2 rounded-xl text-xs shadow-xs flex items-center gap-1.5"
            >
              <LucideIcon name="refresh" className="w-3.5 h-3.5" />
              <span>Refresh Charts</span>
            </button>
          </div>

          {/* DYNAMIC KPI SUMMARY CARDS */}
          {summary && (
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
              <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs">
                <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block">Resolution Velocity</span>
                <div className="flex items-baseline gap-2 mt-2">
                  <span className="text-3xl font-black text-emerald-600">{summary.resolution_rate}%</span>
                  <span className="text-xs text-slate-500">({summary.resolved}/{summary.total} resolved)</span>
                </div>
              </div>

              <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs">
                <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block">Average Priority Score</span>
                <div className="flex items-baseline gap-2 mt-2">
                  <span className="text-3xl font-black text-blue-600">{summary.avg_priority_score}</span>
                  <span className="text-xs text-slate-500">/ 100 max index</span>
                </div>
              </div>

              <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs">
                <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block">Critical & High Backlog</span>
                <div className="flex items-baseline gap-2 mt-2">
                  <span className="text-3xl font-black text-red-600">{summary.critical_and_high}</span>
                  <span className="text-xs text-slate-500">Urgent field tickets</span>
                </div>
              </div>

              <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs">
                <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block">Duplicates Merged</span>
                <div className="flex items-baseline gap-2 mt-2">
                  <span className="text-3xl font-black text-purple-600">{summary.duplicates_flagged}</span>
                  <span className="text-xs text-slate-500">Linked tickets</span>
                </div>
              </div>
            </div>
          )}

          {/* 4 CHART.JS VISUALIZATIONS */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
              <h4 className="font-bold text-sm text-slate-900 mb-4 flex items-center gap-2">
                <span>🍩</span> Category Distribution (NLP Classification)
              </h4>
              <div className="h-64 relative">
                <canvas ref={categoryChartRef}></canvas>
              </div>
            </div>

            <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
              <h4 className="font-bold text-sm text-slate-900 mb-4 flex items-center gap-2">
                <span>📊</span> Priority Distribution
              </h4>
              <div className="h-64 relative">
                <canvas ref={priorityChartRef}></canvas>
              </div>
            </div>

            <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
              <h4 className="font-bold text-sm text-slate-900 mb-4 flex items-center gap-2">
                <span>🔄</span> Pending versus Resolved Resolution Pipeline
              </h4>
              <div className="h-64 relative">
                <canvas ref={statusChartRef}></canvas>
              </div>
            </div>

            <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
              <h4 className="font-bold text-sm text-slate-900 mb-4 flex items-center gap-2">
                <span>📈</span> Monthly Complaints Statistics
              </h4>
              <div className="h-64 relative">
                <canvas ref={monthlyChartRef}></canvas>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Mount Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
