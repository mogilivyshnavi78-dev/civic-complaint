<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intelligent Civic Complaint Prioritization System</title>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            civic: {
              50: '#f0f7ff',
              100: '#e0effe',
              200: '#bae0fd',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              800: '#0c4a6e',
              900: '#0a3550',
              950: '#062033',
            },
            govnavy: '#0b233a',
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js 4 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

  <style>
    body {
      background-color: #f8fafc;
      font-family: 'Inter', sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .line-clamp-1 {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col selection:bg-blue-100 selection:text-blue-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const API_BASE = '/api';

    const CATEGORIES = [
      'Road Damage',
      'Garbage Accumulation',
      'Water Leakage',
      'Blocked Drainage',
      'Broken Streetlights'
    ];

    // ==========================================
    // LUCIDE SVG ICONS COMPONENT
    // ==========================================
    function LucideIcon({ name, className = "w-5 h-5", ...props }) {
      const icons = {
        home: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
        ),
        filePlus: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
        ),
        search: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        ),
        dashboard: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
          </svg>
        ),
        barChart: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
          </svg>
        ),
        shield: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
        ),
        user: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        ),
        logIn: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
          </svg>
        ),
        logOut: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        ),
        alertTriangle: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        ),
        checkCircle: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        ),
        xCircle: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        ),
        clock: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        ),
        refresh: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        ),
        copy: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
        ),
        arrowLeft: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
        ),
        building: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
          </svg>
        ),
        camera: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
            <path strokeLinecap="round" strokeLinejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        ),
        menu: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        ),
        x: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        )
      };

      return icons[name] || icons.home;
    }

    // Helper Badges
    function getPriorityBadge(priority) {
      switch (priority) {
        case 'Critical':
          return 'bg-red-100 text-red-800 border-red-200 ring-1 ring-red-300';
        case 'High':
          return 'bg-orange-100 text-orange-800 border-orange-200 ring-1 ring-orange-300';
        case 'Medium':
          return 'bg-amber-100 text-amber-800 border-amber-200 ring-1 ring-amber-300';
        case 'Low':
        default:
          return 'bg-blue-50 text-blue-700 border-blue-200';
      }
    }

    function getStatusBadge(status) {
      switch (status) {
        case 'Pending':
          return 'bg-amber-50 text-amber-700 border-amber-200';
        case 'Verified':
          return 'bg-blue-50 text-blue-700 border-blue-200';
        case 'In Progress':
          return 'bg-purple-50 text-purple-700 border-purple-200';
        case 'Resolved':
          return 'bg-emerald-50 text-emerald-700 border-emerald-200';
        case 'Rejected':
          return 'bg-rose-50 text-rose-700 border-rose-200';
        default:
          return 'bg-slate-50 text-slate-700 border-slate-200';
      }
    }

    function getCategoryIcon(cat) {
      switch (cat) {
        case 'Road Damage': return '🚧';
        case 'Garbage Accumulation': return '🗑️';
        case 'Water Leakage': return '💧';
        case 'Blocked Drainage': return '🌊';
        case 'Broken Streetlights': return '💡';
        default: return '📋';
      }
    }

    // ==========================================
    // MAIN APP WITH PROFESSIONAL SIDEBAR & ROUTER
    // ==========================================
    function App() {
      // Routing state: 'home', 'submit', 'track', 'login', 'dashboard', 'details', 'analytics'
      const [currentPage, setCurrentPage] = useState('home');
      const [currentParam, setCurrentParam] = useState(''); // e.g. complaint ID for track or details
      const [mobileSidebarOpen, setMobileSidebarOpen] = useState(false);

      const [currentUser, setCurrentUser] = useState(null);
      const [token, setToken] = useState(localStorage.getItem('civic_token') || '');
      const [toast, setToast] = useState(null);

      const showToast = (message, type = 'info') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4500);
      };

      // Hash-based navigation synchronization
      useEffect(() => {
        const handleHashChange = () => {
          const hash = window.location.hash.replace('#/', '').replace('#', '');
          const parts = hash.split('/');
          const page = parts[0] || 'home';
          const param = parts[1] || '';
          
          if (['home', 'submit', 'track', 'login', 'dashboard', 'details', 'analytics'].includes(page)) {
            setCurrentPage(page);
            setCurrentParam(param);
          } else {
            setCurrentPage('home');
          }
        };

        handleHashChange();
        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      const navigate = (page, param = '') => {
        if (param) {
          window.location.hash = `#/${page}/${param}`;
        } else {
          window.location.hash = `#/${page}`;
        }
        setMobileSidebarOpen(false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // Verify token & user
      useEffect(() => {
        if (token) {
          fetch(`${API_BASE}/auth/me`, {
            headers: { 'Authorization': `Bearer ${token}` }
          })
          .then(res => res.ok ? res.json() : null)
          .then(data => {
            if (data && data.user) {
              setCurrentUser(data.user);
            } else {
              localStorage.removeItem('civic_token');
              setToken('');
              setCurrentUser(null);
            }
          })
          .catch(() => {});
        }
      }, [token]);

      const handleLoginSuccess = (user, authToken) => {
        setCurrentUser(user);
        setToken(authToken);
        localStorage.setItem('civic_token', authToken);
        showToast(`Welcome back, ${user.name}!`, 'success');
        if (user.role === 'staff') {
          navigate('dashboard');
        } else {
          navigate('submit');
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setToken('');
        localStorage.removeItem('civic_token');
        showToast('Logged out successfully.', 'info');
        navigate('home');
      };

      return (
        <div className="min-h-screen flex bg-slate-50">
          {/* TOAST ALERTS */}
          {toast && (
            <div className={`fixed bottom-5 right-5 z-50 flex items-center gap-3 px-5 py-3.5 rounded-xl shadow-2xl border text-xs sm:text-sm font-semibold transition-all transform animate-bounce ${
              toast.type === 'success' ? 'bg-emerald-600 text-white border-emerald-500' :
              toast.type === 'error' ? 'bg-rose-600 text-white border-rose-500' :
              toast.type === 'warning' ? 'bg-amber-500 text-white border-amber-400' :
              'bg-slate-900 text-white border-slate-700'
            }`}>
              <span>{toast.message}</span>
              <button onClick={() => setToast(null)} className="ml-2 hover:opacity-75">✕</button>
            </div>
          )}

          {/* DESKTOP SIDEBAR */}
          <aside className="hidden lg:flex flex-col w-72 bg-govnavy text-white flex-shrink-0 border-r border-civic-900 select-none sticky top-0 h-screen z-30">
            {/* Sidebar Branding */}
            <div className="p-6 border-b border-civic-900/80 flex items-center gap-3.5 cursor-pointer" onClick={() => navigate('home')}>
              <div className="w-11 h-11 rounded-xl bg-gradient-to-br from-blue-500 to-civic-700 flex items-center justify-center text-white shadow-lg border border-blue-400/30">
                <LucideIcon name="building" className="w-6 h-6 text-white" />
              </div>
              <div>
                <div className="flex items-center gap-1.5">
                  <h1 className="font-bold text-base tracking-tight text-white">CivicResolve AI</h1>
                  <span className="bg-blue-500/20 text-blue-300 text-[9px] font-bold px-1.5 py-0.5 rounded uppercase">Gov 2.0</span>
                </div>
                <p className="text-[11px] text-slate-300 font-medium">Smart Prioritization Portal</p>
              </div>
            </div>

            {/* Navigation Links */}
            <nav className="flex-1 p-4 space-y-6 overflow-y-auto">
              <div>
                <div className="text-[10px] font-bold uppercase tracking-wider text-slate-400 px-3 mb-2">
                  Public Citizen Services
                </div>
                <div className="space-y-1">
                  <button
                    onClick={() => navigate('home')}
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                      currentPage === 'home' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-300 hover:text-white hover:bg-civic-900'
                    }`}
                  >
                    <LucideIcon name="home" className="w-4 h-4" />
                    <span>Home Overview</span>
                  </button>

                  <button
                    onClick={() => navigate('submit')}
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                      currentPage === 'submit' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-300 hover:text-white hover:bg-civic-900'
                    }`}
                  >
                    <LucideIcon name="filePlus" className="w-4 h-4" />
                    <span>Submit Complaint</span>
                  </button>

                  <button
                    onClick={() => navigate('track')}
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                      currentPage === 'track' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-300 hover:text-white hover:bg-civic-900'
                    }`}
                  >
                    <LucideIcon name="search" className="w-4 h-4" />
                    <span>Track Complaint Status</span>
                  </button>
                </div>
              </div>

              <div>
                <div className="text-[10px] font-bold uppercase tracking-wider text-slate-400 px-3 mb-2">
                  Staff & Administration
                </div>
                <div className="space-y-1">
                  <button
                    onClick={() => navigate('dashboard')}
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                      currentPage === 'dashboard' || currentPage === 'details' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-300 hover:text-white hover:bg-civic-900'
                    }`}
                  >
                    <LucideIcon name="dashboard" className="w-4 h-4" />
                    <span>Staff Dashboard</span>
                  </button>

                  <button
                    onClick={() => navigate('analytics')}
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                      currentPage === 'analytics' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-300 hover:text-white hover:bg-civic-900'
                    }`}
                  >
                    <LucideIcon name="barChart" className="w-4 h-4" />
                    <span>Analytics & Charts</span>
                  </button>
                </div>
              </div>
            </nav>

            {/* Sidebar Bottom Profile / Login */}
            <div className="p-4 border-t border-civic-900/80 bg-civic-950/40">
              {currentUser ? (
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2.5 overflow-hidden">
                    <div className="w-8 h-8 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-xs flex-shrink-0">
                      {currentUser.name.charAt(0)}
                    </div>
                    <div className="overflow-hidden text-left">
                      <div className="text-xs font-bold text-white truncate">{currentUser.name}</div>
                      <div className="text-[10px] text-blue-300 capitalize">{currentUser.role} Account</div>
                    </div>
                  </div>
                  <button
                    onClick={handleLogout}
                    title="Log Out"
                    className="text-slate-400 hover:text-rose-400 p-1.5 transition-colors"
                  >
                    <LucideIcon name="logOut" className="w-4 h-4" />
                  </button>
                </div>
              ) : (
                <button
                  onClick={() => navigate('login')}
                  className="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-2 px-3 rounded-xl transition-all shadow-md flex items-center justify-center gap-2"
                >
                  <LucideIcon name="logIn" className="w-4 h-4" />
                  <span>Official / Citizen Login</span>
                </button>
              )}
            </div>
          </aside>

          {/* MOBILE SIDEBAR OVERLAY */}
          {mobileSidebarOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm lg:hidden flex">
              <div className="w-72 bg-govnavy text-white flex flex-col h-full shadow-2xl">
                <div className="p-5 border-b border-civic-900 flex justify-between items-center">
                  <div className="flex items-center gap-2.5">
                    <LucideIcon name="building" className="w-6 h-6 text-blue-400" />
                    <span className="font-bold text-white text-base">CivicResolve AI</span>
                  </div>
                  <button onClick={() => setMobileSidebarOpen(false)} className="text-slate-400 hover:text-white p-1">
                    <LucideIcon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-4 space-y-4 flex-1 overflow-y-auto">
                  <button onClick={() => navigate('home')} className="w-full text-left py-2.5 px-3 rounded-lg text-sm font-semibold hover:bg-civic-900 flex items-center gap-3">
                    <LucideIcon name="home" className="w-4 h-4" /> Home
                  </button>
                  <button onClick={() => navigate('submit')} className="w-full text-left py-2.5 px-3 rounded-lg text-sm font-semibold hover:bg-civic-900 flex items-center gap-3">
                    <LucideIcon name="filePlus" className="w-4 h-4" /> Submit Complaint
                  </button>
                  <button onClick={() => navigate('track')} className="w-full text-left py-2.5 px-3 rounded-lg text-sm font-semibold hover:bg-civic-900 flex items-center gap-3">
                    <LucideIcon name="search" className="w-4 h-4" /> Track Complaint
                  </button>
                  <button onClick={() => navigate('dashboard')} className="w-full text-left py-2.5 px-3 rounded-lg text-sm font-semibold hover:bg-civic-900 flex items-center gap-3">
                    <LucideIcon name="dashboard" className="w-4 h-4" /> Staff Dashboard
                  </button>

    // ==========================================
    // 2. CITIZEN COMPLAINT FORM PAGE
    // ==========================================
    function ComplaintFormPage({ navigate, currentUser, showToast }) {
      const [title, setTitle] = useState('');
      const [description, setDescription] = useState('');
      const [category, setCategory] = useState('auto');
      const [location, setLocation] = useState('');
      const [landmark, setLandmark] = useState('');
      const [citizenName, setCitizenName] = useState(currentUser?.name || '');
      const [citizenEmail, setCitizenEmail] = useState(currentUser?.email || '');
      const [citizenPhone, setCitizenPhone] = useState(currentUser?.phone || '');
      const [imageFile, setImageFile] = useState(null);
      const [imagePreview, setImagePreview] = useState(null);
      const [submitting, setSubmitting] = useState(false);

      // AI Preview
      const [aiPreview, setAiPreview] = useState(null);
      const [aiLoading, setAiLoading] = useState(false);

      // Submission Confirmation Modal
      const [submittedComplaint, setSubmittedComplaint] = useState(null);

      // Live debounced AI evaluation
      useEffect(() => {
        if (!title.trim() && !description.trim()) {
          setAiPreview(null);
          return;
        }

        const timer = setTimeout(async () => {
          setAiLoading(true);
          try {
            const res = await fetch(`${API_BASE}/complaints/preview`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                title,
                description,
                category: category === 'auto' ? '' : category,
                location,
                landmark
              })
            });
            if (res.ok) {
              const data = await res.json();
              setAiPreview(data);
            }
          } catch (e) {
            console.error(e);
          } finally {
            setAiLoading(false);
          }
        }, 400);

        return () => clearTimeout(timer);
      }, [title, description, category, location, landmark]);

      const handleImageChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          setImageFile(file);
          setImagePreview(URL.createObjectURL(file));
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!title.trim() || !description.trim() || !location.trim()) {
          showToast('Please fill in title, description, and location.', 'warning');
          return;
        }

        setSubmitting(true);
        try {
          const formData = new FormData();
          formData.append('title', title);
          formData.append('description', description);
          if (category !== 'auto') formData.append('category', category);
          formData.append('location', location);
          formData.append('landmark', landmark);
          formData.append('citizen_name', citizenName);
          formData.append('citizen_email', citizenEmail);
          formData.append('citizen_phone', citizenPhone);
          if (imageFile) formData.append('image', imageFile);

          const res = await fetch(`${API_BASE}/complaints`, {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Submission failed');

          setSubmittedComplaint(data);
          showToast(`Complaint ${data.complaint_id} submitted successfully!`, 'success');
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start animate-fade-in">
          {/* LEFT: CITIZEN COMPLAINT FORM */}
          <div className="lg:col-span-7 bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
            <div className="mb-6">
              <h2 className="text-xl font-bold text-slate-900 tracking-tight">Citizen Grievance Submission</h2>
              <p className="text-xs text-slate-500 mt-1">
                Report a municipal issue. Our NLP model will classify it and calculate its priority index in real time.
              </p>
            </div>

            <form onSubmit={handleSubmit} className="space-y-5">
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                  Complaint Title *
                </label>
                <input
                  type="text"
                  required
                  placeholder="e.g. Broken streetlight with exposed live sparking wire"
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  className="w-full px-4 py-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                />
              </div>

              <div>
                <div className="flex justify-between items-center mb-1.5">
                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider">
                    Detailed Description *
                  </label>
                  <span className="text-[11px] text-slate-400">Describe risk, duration, or impact</span>
                </div>
                <textarea
                  rows="4"
                  required
                  placeholder="Provide complete details (e.g. High voltage wire dangling outside elementary school gate after storm, risk of electric shock)..."
                  value={description}
                  onChange={(e) => setDescription(e.target.value)}
                  className="w-full px-4 py-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                ></textarea>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Category Selection
                  </label>
                  <select
                    value={category}
                    onChange={(e) => setCategory(e.target.value)}
                    className="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none font-medium"
                  >
                    <option value="auto">✨ AI Auto-Classification (NLP)</option>
                    {CATEGORIES.map(c => (
                      <option key={c} value={c}>{getCategoryIcon(c)} {c}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Location / Address *
                  </label>
                  <input
                    type="text"
                    required
                    placeholder="e.g. 4th Cross, Gandhi Road"
                    value={location}
                    onChange={(e) => setLocation(e.target.value)}

                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                  Nearby Landmark (Helps Priority & Impact Scoring)
                </label>
                <input
                  type="text"
                  placeholder="e.g. Near St. Mary School, Opposite Metro Station, Beside Apex Hospital"
                  value={landmark}
                  onChange={(e) => setLandmark(e.target.value)}
                  className="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                />
              </div>

              {/* IMAGE EVIDENCE DROPZONE */}
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                  Upload Image Evidence (Optional)
                </label>
                <div className="flex items-center gap-4">
                  <label className="flex-1 border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-xl p-4 text-center cursor-pointer transition-colors bg-slate-50 hover:bg-blue-50/40">
                    <input
                      type="file"
                      accept="image/*"
                      onChange={handleImageChange}
                      className="hidden"
                    />
                    <div className="flex flex-col items-center gap-1">
                      <LucideIcon name="camera" className="w-6 h-6 text-slate-500" />
                      <span className="text-xs font-semibold text-slate-700">Click to upload photo evidence</span>
                      <span className="text-[10px] text-slate-400">PNG, JPG, WEBP up to 16MB</span>
                    </div>
                  </label>

                  {imagePreview && (
                    <div className="relative w-24 h-24 rounded-xl overflow-hidden border border-slate-300 shadow-xs flex-shrink-0">
                      <img src={imagePreview} alt="Preview" className="w-full h-full object-cover" />
                      <button
                        type="button"
                        onClick={() => { setImageFile(null); setImagePreview(null); }}
                        className="absolute top-1 right-1 bg-black/70 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs hover:bg-black"
                      >
                        ✕
                      </button>
                    </div>
                  )}
                </div>
              </div>

              {/* Citizen Contact Fields */}
              <div className="pt-2 border-t border-slate-100">
                <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-2">
                  Citizen Contact (For Verification & SMS Updates)
                </span>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <input
                    type="text"
                    placeholder="Citizen Name"
                    value={citizenName}
                    onChange={(e) => setCitizenName(e.target.value)}
                    className="px-3 py-2 border border-slate-300 rounded-lg text-xs"
                  />
                  <input
                    type="email"
                    placeholder="Citizen Email"
                    value={citizenEmail}
                    onChange={(e) => setCitizenEmail(e.target.value)}
                    className="px-3 py-2 border border-slate-300 rounded-lg text-xs"
                  />
                  <input
                    type="tel"
                    placeholder="Phone (Optional)"
                    value={citizenPhone}
                    onChange={(e) => setCitizenPhone(e.target.value)}
                    className="px-3 py-2 border border-slate-300 rounded-lg text-xs"
                  />
                </div>
              </div>

              <button
                type="submit"
                disabled={submitting}
                className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md hover:shadow-blue-600/30 transition-all text-sm flex items-center justify-center gap-2"
              >
                {submitting ? (
                  <span>Submitting & Analyzing with AI...</span>
                ) : (
                  <>
                    <LucideIcon name="filePlus" className="w-4 h-4" />
                    <span>Submit Complaint</span>
                  </>
                )}
              </button>
            </form>
          </div>

          {/* RIGHT: LIVE AI DIAGNOSTIC PREVIEW */}
          <div className="lg:col-span-5 space-y-5">
            <div className="bg-gradient-to-br from-slate-900 to-civic-950 text-white rounded-2xl shadow-xl p-6 border border-slate-800">
              <div className="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
                <div className="flex items-center gap-2">
                  <span className="text-lg">🤖</span>
                  <h3 className="font-bold text-sm tracking-wide text-white uppercase">Live AI Assessment</h3>
                </div>
                {aiLoading ? (
                  <span className="text-[11px] text-blue-400 animate-pulse font-medium">Analyzing NLP...</span>
                ) : (
                  <span className="text-[10px] bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded-full border border-blue-400/30 font-mono">
                    Scikit-Learn Ready
                  </span>
                )}
              </div>

              {aiPreview ? (
                <div className="space-y-4">
                  {/* Category Prediction */}
                  <div className="bg-slate-800/80 rounded-xl p-4 border border-slate-700/80">
                    <div className="text-[11px] text-slate-400 font-medium mb-1">Predicted Category:</div>

    // 3. COMPLAINT TRACKING PAGE
    // ==========================================
    function ComplaintTrackingPage({ initialId, navigate, showToast }) {
      const [searchId, setSearchId] = useState(initialId || '');
      const [complaint, setComplaint] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const fetchTracking = async (idToSearch) => {
        const id = (idToSearch || searchId).trim();
        if (!id) return;
        setLoading(true);
        setError('');

        try {
          const res = await fetch(`${API_BASE}/complaints/track/${id}`);
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Complaint not found');
          setComplaint(data.complaint);
        } catch (err) {
          setError(err.message);
          setComplaint(null);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        if (initialId) {
          fetchTracking(initialId);
        }
      }, [initialId]);

      const steps = ['Pending', 'Verified', 'In Progress', 'Resolved'];
      const currentStepIdx = complaint ? steps.indexOf(complaint.status) : -1;
      const isRejected = complaint?.status === 'Rejected';

      return (
        <div className="max-w-4xl mx-auto space-y-8 animate-fade-in">
          {/* SEARCH BOX */}
          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
            <h2 className="text-xl font-bold text-slate-900 tracking-tight mb-2">Track Grievance Status</h2>
            <p className="text-xs text-slate-500 mb-6">
              Enter your unique Complaint ID (e.g. CIVIC-2026-1001) to view real-time field status and history.
            </p>

            <form onSubmit={(e) => { e.preventDefault(); fetchTracking(); }} className="flex gap-3">
              <input
                type="text"
                placeholder="Enter Complaint ID (e.g. CIVIC-2026-1001)"
                value={searchId}
                onChange={(e) => setSearchId(e.target.value)}
                className="flex-1 px-4 py-3 border border-slate-300 rounded-xl text-sm font-mono focus:ring-2 focus:ring-blue-500 focus:outline-none uppercase"
              />
              <button
                type="submit"
                disabled={loading}
                className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-xl transition-all shadow-md text-sm flex items-center gap-1.5"
              >
                <LucideIcon name="search" className="w-4 h-4" />
                <span>{loading ? 'Searching...' : 'Track'}</span>
              </button>
            </form>

            {/* Quick Sample IDs */}
            <div className="mt-4 flex flex-wrap items-center gap-2 text-xs text-slate-500">
              <span>Try sample complaints:</span>
              {['CIVIC-2026-1001', 'CIVIC-2026-1002', 'CIVIC-2026-1003', 'CIVIC-2026-1008'].map(sid => (
                <button
                  key={sid}
                  type="button"
                  onClick={() => { setSearchId(sid); fetchTracking(sid); }}
                  className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-mono text-[11px] px-2.5 py-1 rounded-md"
                >
                  {sid}
                </button>
              ))}
            </div>

            {error && (
              <div className="mt-4 p-4 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl font-medium">
                {error}
              </div>
            )}
          </div>

          {/* COMPLAINT DETAILS & STEPPER TIMELINE */}
          {complaint && (
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 space-y-8 animate-fade-in">
              {/* Header */}
              <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-4 pb-6 border-b border-slate-200">
                <div>
                  <div className="flex items-center gap-2 mb-1">
                    <span className="font-mono font-bold text-sm text-blue-700">{complaint.complaint_id}</span>
                    <span className={`text-xs font-semibold px-2.5 py-0.5 rounded-full border ${getStatusBadge(complaint.status)}`}>
                      {complaint.status}
                    </span>
                    <span className={`text-xs font-extrabold px-2.5 py-0.5 rounded-full ${getPriorityBadge(complaint.priority)}`}>
                      {complaint.priority} ({complaint.priority_score} pts)
                    </span>
                  </div>
                  <h3 className="text-lg font-bold text-slate-900">{complaint.title}</h3>
                  <p className="text-xs text-slate-500 mt-0.5">
                    📍 {complaint.location} {complaint.landmark && `(Near ${complaint.landmark})`}
                  </p>
                </div>

                <div className="text-right text-xs text-slate-400">
                  <div>Submitted on</div>
                  <div className="font-medium text-slate-700">{complaint.created_at}</div>
                </div>
              </div>

              {/* TIMELINE PROGRESS STEPPER */}
              <div>
                <h4 className="text-xs font-bold text-slate-700 uppercase tracking-wider mb-6">Resolution Progress</h4>
                {isRejected ? (
                  <div className="bg-rose-50 border border-rose-200 rounded-xl p-4 text-xs text-rose-700">
                    <strong>Complaint Rejected:</strong> This issue was marked outside municipal jurisdiction or invalid.
                  </div>
                ) : (
                  <div className="relative">
                    <div className="absolute top-4 left-6 right-6 h-1 bg-slate-200 -z-0 hidden sm:block">
                      <div
                        className="bg-blue-600 h-1 transition-all duration-500"
                        style={{ width: `${Math.max(0, currentStepIdx / (steps.length - 1)) * 100}%` }}
                      ></div>
                    </div>

                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 relative z-10">
                      {steps.map((st, idx) => {
                        const isDone = idx <= currentStepIdx;
                        const isCurrent = idx === currentStepIdx;
                        return (
                          <div key={st} className="flex flex-col items-center text-center">
                            <div className={`w-9 h-9 rounded-full flex items-center justify-center font-bold text-xs mb-2 transition-all ${
                              isDone ? 'bg-blue-600 text-white ring-4 ring-blue-100 shadow-md' : 'bg-slate-200 text-slate-500'
                            }`}>
                              {isDone ? '✓' : idx + 1}
                            </div>
                            <span className={`text-xs font-bold ${isCurrent ? 'text-blue-700 font-extrabold' : isDone ? 'text-slate-800' : 'text-slate-400'}`}>
                              {st}
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>

              {/* Description & Photo */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6 pt-6 border-t border-slate-100">
                <div className="md:col-span-2 space-y-4">
                  <div>
                    <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Description</span>
                    <p className="text-sm text-slate-700 leading-relaxed bg-slate-50 p-4 rounded-xl border border-slate-200">
                      {complaint.description}
                    </p>
                  </div>

                  <div className="bg-blue-50/70 border border-blue-200 rounded-xl p-4 text-xs">
                    <span className="font-bold text-blue-900 block mb-1">🤖 AI Priority Rationale:</span>
                    <p className="text-blue-800 leading-relaxed">{complaint.priority_reason}</p>
                  </div>
                </div>

                {complaint.image_url ? (
                  <div>
                    <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Attached Photo</span>
                    <div className="rounded-xl overflow-hidden border border-slate-200 shadow-sm">
                      <img src={complaint.image_url} alt="Evidence" className="w-full h-44 object-cover" />
                    </div>
                  </div>
                ) : (
                  <div className="bg-slate-50 rounded-xl border border-dashed border-slate-200 p-4 flex flex-col items-center justify-center text-slate-400 text-xs text-center">
                    <LucideIcon name="camera" className="w-6 h-6 mb-1" />
                    <span>No image attached</span>
                  </div>
                )}
              </div>

              {/* AUDIT LOG TIMELINE */}
              <div className="pt-6 border-t border-slate-100">
                <h4 className="text-xs font-bold text-slate-700 uppercase tracking-wider mb-4">Official Action & Audit Trail</h4>
                <div className="space-y-3">
                  {complaint.history && complaint.history.map((h, i) => (
                    <div key={i} className="flex items-start gap-3 p-3.5 bg-slate-50 rounded-xl border border-slate-200 text-xs">
                      <div className="w-2 h-2 rounded-full bg-blue-500 mt-1.5 flex-shrink-0"></div>
                      <div className="flex-1">
                        <div className="flex justify-between items-center mb-1">
                          <span className="font-bold text-slate-800">
                            Status changed to <span className="text-blue-700">{h.new_status}</span> by {h.changed_by}
                          </span>
                          <span className="text-slate-400 text-[11px] font-mono">{h.created_at}</span>
                        </div>
                        {h.notes && <p className="text-slate-600 italic">"{h.notes}"</p>}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

          setEmail('citizen@example.com');
          setPassword('citizen123');
          setMode('citizen');
        }
        setError('');

        e.preventDefault();
        setError('');
        setLoading(true);

          if (mode === 'register') {

              method: 'POST',
              headers: { 'Content-Type': 'application/json' },

    // ==========================================
    // 5. STAFF DASHBOARD PAGE
    // ==========================================
    function StaffDashboardPage({ currentUser, token, navigate, showToast }) {
      const [complaints, setComplaints] = useState([]);
      const [summary, setSummary] = useState(null);
      const [loading, setLoading] = useState(true);

      // Filters
      const [search, setSearch] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('All');
      const [priorityFilter, setPriorityFilter] = useState('All');
      const [statusFilter, setStatusFilter] = useState('All');
      const [duplicateFilter, setDuplicateFilter] = useState('All');
      const [sortBy, setSortBy] = useState('priority_score');

      const fetchDashboardData = async () => {
        setLoading(true);
        try {
          const params = new URLSearchParams();
          if (search) params.append('search', search);
          if (categoryFilter !== 'All') params.append('category', categoryFilter);
          if (priorityFilter !== 'All') params.append('priority', priorityFilter);
          if (statusFilter !== 'All') params.append('status', statusFilter);
          if (duplicateFilter === 'Duplicates Only') params.append('is_duplicate', '1');
          if (duplicateFilter === 'Unique Only') params.append('is_duplicate', '0');
          params.append('sort_by', sortBy);

          const [compRes, sumRes] = await Promise.all([
            fetch(`${API_BASE}/staff/complaints?${params.toString()}`),
            fetch(`${API_BASE}/analytics/summary`)
          ]);

          const compData = await compRes.json();
          const sumData = await sumRes.json();

          setComplaints(compData.complaints || []);
          setSummary(sumData);
        } catch (e) {
          console.error(e);
          showToast('Failed to fetch staff complaints', 'error');
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchDashboardData();
      }, [search, categoryFilter, priorityFilter, statusFilter, duplicateFilter, sortBy]);

      const handleRecalculatePriorities = async () => {
        try {
          const authTok = token || localStorage.getItem('token');
          const res = await fetch(`${API_BASE}/staff/recalculate-priorities`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(authTok ? { 'Authorization': `Bearer ${authTok}` } : {})
            }
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to recalculate priorities');
          showToast(data.message, 'success');
          fetchDashboardData();
        } catch (e) {
          showToast(e.message || 'Error recalculating aging priorities', 'error');

      return (
        <div className="space-y-8 animate-fade-in">

          <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-4">

              <span>Recalculate Aging Priorities</span>

          {/* DYNAMIC KPI SUMMARY CARDS */}
          {summary && (
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3.5">
              <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-xs">
                <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Total Complaints</span>
                <span className="text-2xl font-black text-slate-900 mt-1 block">{summary.total}</span>
              </div>

              <div className="bg-white rounded-2xl p-4 border border-amber-200 shadow-xs">
                <span className="text-[11px] font-bold text-amber-600 uppercase tracking-wider block">Pending</span>
                <span className="text-2xl font-black text-amber-600 mt-1 block">{summary.pending}</span>
              </div>

              <div className="bg-white rounded-2xl p-4 border border-blue-200 shadow-xs">
                <span className="text-[11px] font-bold text-blue-600 uppercase tracking-wider block">Verified</span>
                <span className="text-2xl font-black text-blue-600 mt-1 block">{summary.verified}</span>
              </div>

              <div className="bg-white rounded-2xl p-4 border border-emerald-200 shadow-xs">
                <span className="text-[11px] font-bold text-emerald-600 uppercase tracking-wider block">Resolved</span>
                <span className="text-2xl font-black text-emerald-600 mt-1 block">{summary.resolved}</span>
              </div>

              <div className="bg-white rounded-2xl p-4 border border-red-200 shadow-xs bg-red-50/20 col-span-2 sm:col-span-1">
                <span className="text-[11px] font-bold text-red-600 uppercase tracking-wider block">Critical</span>
                <span className="text-2xl font-black text-red-600 mt-1 block">{summary.critical}</span>
              </div>
            </div>
          )}

          {/* TOOLBAR: SEARCH & MULTI-FILTER */}
          <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4">
            <div className="flex flex-col sm:flex-row gap-3">
              <div className="flex-1 relative">
                <input
                  type="text"
                  placeholder="Search by ID, keyword, location, citizen name..."
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  className="w-full pl-9 pr-4 py-2.5 border border-slate-300 rounded-xl text-xs sm:text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                />
                <span className="absolute left-3 top-2.5 text-slate-400">
                  <LucideIcon name="search" className="w-4 h-4" />
                </span>
              </div>

              <select
                value={sortBy}
                onChange={(e) => setSortBy(e.target.value)}
                className="px-3 py-2 border border-slate-300 rounded-xl text-xs font-semibold bg-white text-slate-700"
              >
                <option value="priority_score">Priority Score (Highest first)</option>
                <option value="created_at">Date Submitted (Newest first)</option>
                <option value="waiting_score">Waiting Escalation</option>
              </select>
            </div>

            {/* Filter Pills */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-2 border-t border-slate-100">
              <div>
                <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Category</label>
                <select
                  value={categoryFilter}
                  onChange={(e) => setCategoryFilter(e.target.value)}
                  className="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs bg-slate-50 font-medium"
                >
                  <option value="All">All Categories</option>
                  {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>

              <div>
                <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Priority</label>
                <select
                  value={priorityFilter}
                  onChange={(e) => setPriorityFilter(e.target.value)}
                  className="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs bg-slate-50 font-medium"
                >
                  <option value="All">All Priorities</option>
                  {['Critical', 'High', 'Medium', 'Low'].map(p => <option key={p} value={p}>{p}</option>)}
                </select>
              </div>

              <div>
                <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Status</label>
                <select
                  value={statusFilter}
                  onChange={(e) => setStatusFilter(e.target.value)}
                  className="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs bg-slate-50 font-medium"
                >
                  <option value="All">All Statuses</option>
                  {['Pending', 'Verified', 'In Progress', 'Resolved', 'Rejected'].map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>

              <div>
                <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Duplicate</label>
                <select
                  value={duplicateFilter}
                  onChange={(e) => setDuplicateFilter(e.target.value)}
                  className="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs bg-slate-50 font-medium"
                >
                  <option value="All">All Records</option>
                  <option value="Duplicates Only">Flagged Duplicates</option>
                  <option value="Unique Only">Unique Only</option>
                </select>
              </div>
            </div>
          </div>

          {/* RECENT COMPLAINTS TABLE */}
          <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-50/80 text-slate-500 font-bold uppercase tracking-wider border-b border-slate-200">
                  <tr>
                    <th className="py-3.5 px-4">Complaint ID</th>
                    <th className="py-3.5 px-4">Issue Title & Location</th>
                    <th className="py-3.5 px-4">Category (NLP)</th>
                    <th className="py-3.5 px-4">Priority</th>
                    <th className="py-3.5 px-4">Status</th>
                    <th className="py-3.5 px-4">Duplicate</th>
                    <th className="py-3.5 px-4 text-right">Action</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 text-slate-700">
                  {loading ? (
                    <tr>
                      <td colSpan="7" className="text-center py-10 text-slate-400">Loading complaints...</td>
                    </tr>
                  ) : complaints.length === 0 ? (
                    <tr>
                      <td colSpan="7" className="text-center py-10 text-slate-400">No complaints matching the selected criteria.</td>
                    </tr>
                  ) : (
                    complaints.map(comp => (
                      <tr key={comp.complaint_id} className="hover:bg-slate-50/80 transition-colors">
                        <td className="py-3.5 px-4 font-mono font-bold text-blue-700 whitespace-nowrap">
                          {comp.complaint_id}
                        </td>
                        <td className="py-3.5 px-4 max-w-xs">
                          <div className="font-semibold text-slate-900 truncate">{comp.title}</div>
                          <div className="text-[11px] text-slate-400 truncate">📍 {comp.location}</div>
                        </td>
                        <td className="py-3.5 px-4 whitespace-nowrap">
                          <span className="font-medium text-slate-800">
                            {getCategoryIcon(comp.category)} {comp.category}
                          </span>
                          <span className="text-[10px] text-slate-400 block font-mono">
                            {comp.category_confidence}% conf
                          </span>
                        </td>
                        <td className="py-3.5 px-4 whitespace-nowrap">
                          <span className={`inline-flex items-center gap-1 font-extrabold px-2.5 py-1 rounded-full text-[11px] ${getPriorityBadge(comp.priority)}`}>
                            <span>{comp.priority}</span>
                            <span className="font-mono">({comp.priority_score})</span>
                          </span>
                        </td>
                        <td className="py-3.5 px-4 whitespace-nowrap">
                          <span className={`text-[11px] font-bold px-2.5 py-1 rounded-full border ${getStatusBadge(comp.status)}`}>
                            {comp.status}
                          </span>
                        </td>
                        <td className="py-3.5 px-4 whitespace-nowrap">
                          {comp.is_duplicate ? (
                            <span className="inline-flex items-center gap-1 bg-purple-50 text-purple-700 border border-purple-200 px-2 py-0.5 rounded text-[10px] font-semibold">
                              <span>⚠️ Sim: {comp.duplicate_similarity}%</span>
                              <span className="font-mono">({comp.duplicate_of_id})</span>
                            </span>
                          ) : (
                            <span className="text-[10px] text-slate-400">Unique</span>
                          )}

                        <td className="py-3.5 px-4 text-right whitespace-nowrap">

                            Review & Act →
