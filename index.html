    // Helper functions for client-side persistence
    function getStoredComplaints() {
      const stored = localStorage.getItem('civic_complaints_v1');
      if (stored) {
        try { return JSON.parse(stored); } catch (e) {}
      }
      localStorage.setItem('civic_complaints_v1', JSON.stringify(INITIAL_CIVIC_DATA));
      return INITIAL_CIVIC_DATA;
    }

    function saveStoredComplaints(complaints) {
      localStorage.setItem('civic_complaints_v1', JSON.stringify(complaints));
    }

    // Client-side NLP Category Predictor
    function clientPredictCategory(text) {
      const t = (text || '').toLowerCase();
      const scores = {
        'Road Damage': 0,
        'Garbage Accumulation': 0,
        'Water Leakage': 0,
        'Blocked Drainage': 0,
        'Broken Streetlights': 0
      };

      const kw = {
        'Road Damage': ['pothole', 'sinkhole', 'crater', 'asphalt', 'road', 'tar', 'paver', 'curb', 'divider', 'bitumen', 'tarmac', 'fissure', 'crack', 'pavement'],
        'Garbage Accumulation': ['garbage', 'trash', 'dumpster', 'waste', 'litter', 'debris', 'rotting', 'flies', 'stench', 'smell', 'dump', 'food waste'],
        'Water Leakage': ['water', 'pipe', 'pipeline', 'leak', 'gushing', 'burst', 'hydrant', 'potable', 'drinking water', 'tap', 'flooding', 'conduit'],
        'Blocked Drainage': ['drain', 'drainage', 'sewage', 'sewer', 'manhole', 'sludge', 'gutter', 'waterlog', 'culvert', 'choked', 'clogged'],
        'Broken Streetlights': ['streetlight', 'light', 'lamp', 'lamppost', 'sparking', 'wire', 'dark', 'bulb', 'pole', 'led', 'flicker', 'blackout']
      };

      for (const [cat, words] of Object.entries(kw)) {
        for (const w of words) {
          if (t.includes(w)) scores[cat] += 2;
        }
      }

      let bestCat = 'Road Damage';
      let maxScore = -1;
      for (const [cat, sc] of Object.entries(scores)) {
        if (sc > maxScore) { maxScore = sc; bestCat = cat; }
      }
      const confidence = maxScore > 0 ? Math.min(96.5, 60 + maxScore * 8) : 55.0;
      return { predicted_category: bestCat, confidence };
    }

    // Client-side 4-Dimension Priority Calculator
    function clientCalculatePriority(title, description, location) {
      const text = ((title || '') + ' ' + (description || '') + ' ' + (location || '')).toLowerCase();

      let safety = 2.0;
      if (text.includes('live wire') || text.includes('sparking') || text.includes('electric shock') || text.includes('fatal') || text.includes('sinkhole') || text.includes('open manhole')) {
        safety = 9.0;
      } else if (text.includes('hospital') || text.includes('school') || text.includes('children') || text.includes('hazard')) {
        safety = 6.5;
      }

      let severity = 3.0;
      if (text.includes('burst') || text.includes('completely blocked') || text.includes('gushing') || text.includes('knee-deep') || text.includes('massive')) {
        severity = 7.5;
      } else if (text.includes('overflowing') || text.includes('deep') || text.includes('damaged')) {
        severity = 5.5;
      }

      let impact = 4.0;
      if (text.includes('highway') || text.includes('artery') || text.includes('main road') || text.includes('ring road') || text.includes('metro') || text.includes('market')) {
        impact = 7.5;
      } else if (text.includes('station') || text.includes('avenue') || text.includes('bus')) {
        impact = 6.0;
      }

      const waiting = 1.0;
      const score = Math.min(100, Math.max(10, Math.round(((safety * 3.5) + (severity * 2.5) + (impact * 2.5) + (waiting * 1.5)) * 10) / 10));

      let priority = 'Low';
      if (score >= 80) priority = 'Critical';
      else if (score >= 60) priority = 'High';
      else if (score >= 40) priority = 'Medium';

      return {
        score,
        priority,
        explanation: `Assigned ${priority} Priority with a score of ${score}/100. Safety: ${safety}/10, Severity: ${severity}/10, Public Impact: ${impact}/10, Waiting Escalation: ${waiting}/10.`,
        sub_scores: { safety_risk: safety, severity, public_impact: impact, waiting_time: waiting }
      };
    }

    // Client-side Duplicate Detector
    function clientFindDuplicates(title, desc, complaints) {
      const tokens = (title + ' ' + desc).toLowerCase().replace(/[^a-z0-9 ]/g, '').split(/\s+/).filter(w => w.length > 3);
      let bestMatch = null;
      let maxPct = 0;

      for (const c of complaints) {
        const cTokens = (c.title + ' ' + c.description).toLowerCase().replace(/[^a-z0-9 ]/g, '').split(/\s+/).filter(w => w.length > 3);
        const intersect = tokens.filter(t => cTokens.includes(t));
        const sim = Math.min(100, Math.round((intersect.length * 2 / (tokens.length + cTokens.length)) * 100));
        if (sim > maxPct) {
          maxPct = sim;
          bestMatch = c;
        }
      }

      const isDup = maxPct >= 75;
      return {
        is_duplicate: isDup ? 1 : 0,
        similarity_percentage: maxPct,
        similar_complaint_id: isDup && bestMatch ? bestMatch.complaint_id : null,
        existing_complaint_description: isDup && bestMatch ? bestMatch.description : null,
        matches: maxPct >= 40 && bestMatch ? [{
          complaint_id: bestMatch.complaint_id,
          title: bestMatch.title,
          location: bestMatch.location,
          status: bestMatch.status,
          similarity_percentage: maxPct
        }] : []
      };
    }

    // Client-side Mock Router that handles all REST APIs
    async function mockCivicApi(urlStr, options = {}) {
      const method = (options.method || 'GET').toUpperCase();
      const complaints = getStoredComplaints();
      const parsedUrl = new URL(urlStr, window.location.href);
      const path = parsedUrl.pathname.replace(/^.*?\/api/, '/api');
      const params = parsedUrl.searchParams;

      // Helper to generate a Response object
      const jsonResponse = (data, status = 200) => {
        return new Response(JSON.stringify(data), {
          status,
          headers: { 'Content-Type': 'application/json' }
        });
      };

      // 1. /api/auth/me
      if (path === '/api/auth/me') {
        const tok = localStorage.getItem('civic_token');
        if (tok && tok.includes(':')) {
          const parts = tok.split(':');
          return jsonResponse({ user: { id: parseInt(parts[0]) || 1, role: parts[1], email: parts[2], name: parts[2].split('@')[0] } });
        }
        return jsonResponse({ user: { id: 3, role: 'staff', email: 'staff@civic.gov', name: 'Officer David Vance' } });
      }

      // 2. /api/auth/login
      if (path === '/api/auth/login') {
        const body = options.body ? (typeof options.body === 'string' ? JSON.parse(options.body) : options.body) : {};
        const email = body.email || 'staff@civic.gov';
        const role = email.includes('staff') || email.includes('inspector') ? 'staff' : 'citizen';
        const name = email === 'staff@civic.gov' ? 'Officer David Vance' : (email === 'citizen@example.com' ? 'Rajesh Kumar' : email.split('@')[0]);
        const user = { id: 1, email, name, role, phone: '+1 (555) 019-2831' };
        const token = `1:${role}:${email}`;
        return jsonResponse({ token, user, message: 'Login successful' });
      }

      // 3. /api/auth/register
      if (path === '/api/auth/register') {
        const body = options.body ? JSON.parse(options.body) : {};
        const user = { id: Date.now(), email: body.email || 'new@example.com', name: body.name || 'Citizen', role: 'citizen', phone: body.phone || '' };
        return jsonResponse({ token: `1:citizen:${user.email}`, user, message: 'Registration successful' }, 201);
      }

      // 4. /api/analytics/summary
      if (path === '/api/analytics/summary') {
        const total = complaints.length;
        const pending = complaints.filter(c => c.status === 'Pending').length;
        const verified = complaints.filter(c => c.status === 'Verified').length;
        const in_progress = complaints.filter(c => c.status === 'In Progress').length;
        const resolved = complaints.filter(c => c.status === 'Resolved').length;
        const rejected = complaints.filter(c => c.status === 'Rejected').length;
        const critical = complaints.filter(c => c.priority === 'Critical').length;
        const high = complaints.filter(c => c.priority === 'High').length;
        const duplicates = complaints.filter(c => c.is_duplicate).length;
        const avg_priority = Math.round(complaints.reduce((a, b) => a + (b.priority_score || 50), 0) / (total || 1) * 10) / 10;
        return jsonResponse({
          total, pending, verified, in_progress, resolved, rejected,
          critical, high, critical_and_high: critical + high,
          duplicates_flagged: duplicates,
          resolution_rate: total > 0 ? Math.round((resolved / total) * 1000) / 10 : 0.0,
          avg_priority_score: avg_priority
        });
      }

      // 5. /api/analytics/charts
      if (path === '/api/analytics/charts') {
        const catCounts = CATEGORIES.map(cat => complaints.filter(c => c.category === cat).length);
        const prioCounts = ['Critical', 'High', 'Medium', 'Low'].map(p => complaints.filter(c => c.priority === p).length);
        const statusCounts = ['Pending', 'Verified', 'In Progress', 'Resolved', 'Rejected'].map(s => complaints.filter(c => c.status === s).length);
        return jsonResponse({
          categories: { labels: CATEGORIES, data: catCounts },
          category_distribution: { labels: CATEGORIES, data: catCounts },
          priorities: { labels: ['Critical', 'High', 'Medium', 'Low'], data: prioCounts },
          priority_distribution: { labels: ['Critical', 'High', 'Medium', 'Low'], data: prioCounts },
          statuses: { labels: ['Pending', 'Verified', 'In Progress', 'Resolved', 'Rejected'], data: statusCounts },
          status_distribution: { labels: ['Pending', 'Verified', 'In Progress', 'Resolved', 'Rejected'], data: statusCounts },
          monthly: { labels: ['2026-10', '2026-11'], submitted: [6, complaints.length - 6], resolved: [3, complaints.filter(c => c.status === 'Resolved').length - 3] },
          monthly_trends: { labels: ['2026-10', '2026-11'], submitted: [6, complaints.length - 6], resolved: [3, complaints.filter(c => c.status === 'Resolved').length - 3] }
        });
      }

      // 6. /api/analytics (combined)
      if (path === '/api/analytics') {
        const sumResp = await (await mockCivicApi('/api/analytics/summary')).json();
        const chartResp = await (await mockCivicApi('/api/analytics/charts')).json();
        return jsonResponse({ summary: sumResp, charts: chartResp });
      }

      // 7. /api/complaints/preview
      if (path === '/api/complaints/preview') {
        const body = options.body ? (typeof options.body === 'string' ? JSON.parse(options.body) : options.body) : {};
        const catRes = clientPredictCategory(body.description || body.title || '');
        const prioRes = clientCalculatePriority(body.title, body.description, body.location);
        const dupRes = clientFindDuplicates(body.title || '', body.description || '', complaints);
        return jsonResponse({
          predicted_category: catRes.predicted_category,
          category_confidence: catRes.confidence,
          ai_classification: {
            predicted_category: catRes.predicted_category,
            confidence: catRes.confidence,
            probabilities: { [catRes.predicted_category]: catRes.confidence }
          },
          priority_assessment: {
            priority: prioRes.priority,
            score: prioRes.score,
            priority_score: prioRes.score,
            explanation: prioRes.explanation,
            priority_reason: prioRes.explanation,
            sub_scores: prioRes.sub_scores,
            safety_score: prioRes.sub_scores ? prioRes.sub_scores.safety_risk : 8.0,
            severity_score: prioRes.sub_scores ? prioRes.sub_scores.severity : 7.0,
            impact_score: prioRes.sub_scores ? prioRes.sub_scores.public_impact : 7.5,
            waiting_score: prioRes.sub_scores ? prioRes.sub_scores.waiting_time : 2.0,
            factors: []
          },
          duplicate_analysis: dupRes,
          duplicate_detection: {
            is_duplicate: dupRes.is_duplicate,
            is_duplicate_likely: dupRes.is_duplicate === 1 || dupRes.is_duplicate === true,
            similarity_percentage: dupRes.similarity_percentage,
            top_similarity: dupRes.similarity_percentage,
            similar_complaint_id: dupRes.similar_complaint_id,
            existing_complaint_description: dupRes.existing_complaint_description,
            top_match: dupRes.similar_complaint_id ? { complaint_id: dupRes.similar_complaint_id } : null,
            matches: dupRes.matches || []
          }
        });
      }

      // 8. /api/complaints/track/:id
      if (path.startsWith('/api/complaints/track/')) {
        const id = decodeURIComponent(path.replace('/api/complaints/track/', '').trim());
        const comp = complaints.find(c => String(c.complaint_id).toLowerCase() === id.toLowerCase() || String(c.id) === id);
        if (comp) return jsonResponse({ complaint: comp });
        return jsonResponse({ error: `Complaint '${id}' not found` }, 404);
      }

      // 9. /api/complaints or /api/staff/complaints (GET)
      if ((path === '/api/complaints' || path === '/api/staff/complaints') && method === 'GET') {
        let filtered = [...complaints];
        const search = (params.get('search') || '').toLowerCase();
        const category = params.get('category');
        const priority = params.get('priority');
        const status = params.get('status');
        const duplicate = params.get('duplicate');

        if (search) {
          filtered = filtered.filter(c => (c.title + ' ' + c.description + ' ' + c.complaint_id + ' ' + c.location).toLowerCase().includes(search));
        }
        if (category) filtered = filtered.filter(c => c.category === category);
        if (priority) filtered = filtered.filter(c => c.priority === priority);
        if (status) filtered = filtered.filter(c => c.status === status);
        if (duplicate === '1') filtered = filtered.filter(c => c.is_duplicate);
        if (duplicate === '0') filtered = filtered.filter(c => !c.is_duplicate);

        return jsonResponse({ complaints: filtered, total: filtered.length });
      }

      // 10. Single complaint details: /api/complaints/:id or /api/staff/complaints/:id (GET)
      const detailMatch = path.match(/\/api\/(?:staff\/)?complaints\/([^\/]+)$/);
      if (detailMatch && method === 'GET') {
        const id = decodeURIComponent(detailMatch[1]);
        const comp = complaints.find(c => String(c.complaint_id).toLowerCase() === id.toLowerCase() || String(c.id) === id);
        if (comp) {
          const dupAnalysis = clientFindDuplicates(comp.title, comp.description, complaints.filter(c => c.complaint_id !== comp.complaint_id));
          return jsonResponse({ complaint: { ...comp, duplicate_analysis: dupAnalysis } });
        }
        return jsonResponse({ error: `Complaint #${id} not found` }, 404);
      }

      // 11. Verify complaint: /api/complaints/:id/verify
      if (path.includes('/verify') && (method === 'PUT' || method === 'PATCH' || method === 'POST')) {
        const idMatch = path.match(/\/api\/(?:staff\/)?complaints\/([^\/]+)\/verify/);
        const id = idMatch ? idMatch[1] : '';
        const idx = complaints.findIndex(c => String(c.complaint_id).toLowerCase() === id.toLowerCase() || String(c.id) === id);
        if (idx !== -1) {
          const body = options.body ? JSON.parse(options.body) : {};
          complaints[idx].status = 'Verified';
          complaints[idx].history.push({
            id: Date.now(),
            complaint_id: complaints[idx].complaint_id,
            previous_status: 'Pending',
            new_status: 'Verified',
            changed_by: 'Officer David Vance',
            notes: body.notes || 'Verified by municipal officer.',
            created_at: new Date().toISOString().replace('T', ' ').substring(0, 19)
          });
          saveStoredComplaints(complaints);
          return jsonResponse({ message: `Complaint ${complaints[idx].complaint_id} verified successfully.`, status: 'Verified' });
        }
        return jsonResponse({ error: 'Complaint not found' }, 404);
      }

      // 12. Update Status: /api/complaints/:id/status
      if (path.includes('/status') && (method === 'PUT' || method === 'PATCH' || method === 'POST')) {
        const idMatch = path.match(/\/api\/(?:staff\/)?complaints\/([^\/]+)\/status/);
        const id = idMatch ? idMatch[1] : '';
        const idx = complaints.findIndex(c => String(c.complaint_id).toLowerCase() === id.toLowerCase() || String(c.id) === id);
        if (idx !== -1) {
          const body = options.body ? JSON.parse(options.body) : {};
          const prev = complaints[idx].status;
          complaints[idx].status = body.status || 'Verified';
          complaints[idx].history.push({
            id: Date.now(),
            complaint_id: complaints[idx].complaint_id,
            previous_status: prev,
            new_status: complaints[idx].status,
            changed_by: body.changed_by || 'Officer David Vance',
            notes: body.notes || 'Status updated.',
            created_at: new Date().toISOString().replace('T', ' ').substring(0, 19)
          });
          saveStoredComplaints(complaints);
          return jsonResponse({ message: `Status updated to ${complaints[idx].status}.`, status: complaints[idx].status });

        return jsonResponse({ error: 'Complaint not found' }, 404);

      // 13. Duplicate toggle
      if (path.includes('/duplicate') && (method === 'PATCH' || method === 'PUT')) {
        const idMatch = path.match(/\/api\/(?:staff\/)?complaints\/([^\/]+)\/duplicate/);
        const id = idMatch ? idMatch[1] : '';
        const idx = complaints.findIndex(c => String(c.complaint_id).toLowerCase() === id.toLowerCase() || String(c.id) === id);
        if (idx !== -1) {
          const body = options.body ? JSON.parse(options.body) : {};
          complaints[idx].is_duplicate = body.is_duplicate !== undefined ? body.is_duplicate : 1;
          complaints[idx].duplicate_of_id = body.duplicate_of_id || null;
          complaints[idx].duplicate_similarity = body.duplicate_similarity || 85.0;
          saveStoredComplaints(complaints);
          return jsonResponse({ message: 'Duplicate flag updated successfully.' });
        }
        return jsonResponse({ error: 'Complaint not found' }, 404);
      }

      // 14. Recalculate priorities
      if (path.includes('/recalculate-priorities')) {
        complaints.forEach(c => {
          if (c.status !== 'Resolved' && c.status !== 'Rejected') {
            const p = clientCalculatePriority(c.title, c.description, c.location);
            c.priority = p.priority;
            c.priority_level = p.priority;
            c.priority_score = p.score;
            c.priority_reason = p.explanation;
          }
        });
        saveStoredComplaints(complaints);
        return jsonResponse({ message: `Recalculated priority scores for ${complaints.length} active complaints.` });
      }

      // 15. Submit Complaint: /api/complaints (POST)
      if ((path === '/api/complaints' || path === '/api/staff/complaints') && method === 'POST') {
        let body = {};
        if (options.body instanceof FormData) {
          for (const [k, v] of options.body.entries()) {
            if (typeof v === 'string') body[k] = v;
          }
        } else if (options.body) {

        const newIdNum = 1000 + complaints.length + 1;
        const complaintId = `CIVIC-2026-${newIdNum}`;
        const catRes = clientPredictCategory(body.description || body.title || '');
        const prioRes = clientCalculatePriority(body.title, body.description, body.location);
        const dupRes = clientFindDuplicates(body.title || '', body.description || '', complaints);
        const nowStr = new Date().toISOString().replace('T', ' ').substring(0, 19);

        const newComp = {
          id: complaints.length + 1,
          complaint_id: complaintId,
          title: body.title || 'Untitled Grievance',
          description: body.description || '',
          category: body.category && body.category !== 'Auto-Detect with AI' ? body.category : catRes.predicted_category,
          predicted_category: catRes.predicted_category,
          category_confidence: catRes.confidence,
          location: body.location || 'Municipal Sector',
          landmark: body.landmark || '',
          image_url: body.image_url || 'https://images.unsplash.com/photo-1541888946425-d0fbb18615f3?w=600&auto=format&fit=crop&q=80',
          status: 'Pending',
          priority: prioRes.priority,
          priority_level: prioRes.priority,
          priority_score: prioRes.score,
          priority_reason: prioRes.explanation,
          sub_scores: prioRes.sub_scores,
          is_duplicate: dupRes.is_duplicate,
          duplicate_of_id: dupRes.similar_complaint_id,
          duplicate_similarity: dupRes.similarity_percentage,
          citizen_name: body.citizen_name || 'Citizen Portal',
          citizen_email: body.citizen_email || 'citizen@example.com',
          created_at: nowStr,
          updated_at: nowStr,
          history: [{
            id: Date.now(),
            complaint_id: complaintId,
            previous_status: null,
            new_status: 'Pending',
            changed_by: 'Citizen Portal',
            notes: `Complaint registered. AI Priority: ${prioRes.priority} (${prioRes.score} pts). AI Confidence: ${catRes.confidence}%.`,
            created_at: nowStr
          }]
        };

        complaints.unshift(newComp);
        saveStoredComplaints(complaints);
        return jsonResponse({ message: 'Complaint submitted successfully.', complaint: newComp, ...newComp }, 201);
      }

      return jsonResponse({ message: 'OK', status: 200 });
    }

    // Global Fetch Interceptor
    const originalFetch = window.fetch;
    window.fetch = async function(url, options = {}) {
      const urlStr = typeof url === 'string' ? url : (url && url.url ? url.url : '');
      const isLocalFlask = window.location.port === '5000';
      const hasRemoteBackend = !!configuredBackend;

      // On localhost:5000 or when user specified an external backend URL, attempt real fetch
      if (isLocalFlask || hasRemoteBackend) {
        try {
          let reqUrl = urlStr;
          if (configuredBackend && urlStr.startsWith('/api')) {
            reqUrl = configuredBackend.replace(/\/$/, '') + urlStr;
          }
          const resp = await originalFetch(reqUrl, options);
          const ct = (resp && resp.headers && resp.headers.get) ? (resp.headers.get('content-type') || '') : '';
          if (resp && (resp.ok || ct.includes('application/json'))) {
            return resp;
          }
        } catch (netErr) {
          console.warn('[CivicEngine] Backend fetch error, switching to in-browser engine:', netErr);
        }
      }

      // In-browser mock handler for static GitHub Pages or offline fallback
      if (urlStr.includes('/api/') || urlStr.startsWith('/api') || urlStr.includes('api/')) {
        return mockCivicApi(urlStr, options);
      }

      return originalFetch(url, options);
    };

    // Helper Badges
    function getPriorityBadge(priority) {
      switch (priority) {
        case 'Critical':
          return 'bg-red-100 text-red-800 border-red-200 ring-1 ring-red-300';
        case 'High':
          return 'bg-orange-100 text-orange-800 border-orange-200 ring-1 ring-orange-300';
        case 'Medium':
          return 'bg-amber-100 text-amber-800 border-amber-200 ring-1 ring-amber-300';
        case 'Low':
        default:
          return 'bg-blue-50 text-blue-700 border-blue-200';
      }
    }

    function getStatusBadge(status) {
      switch (status) {
        case 'Pending':
          return 'bg-amber-50 text-amber-700 border-amber-200';
        case 'Verified':
          return 'bg-blue-50 text-blue-700 border-blue-200';
        case 'In Progress':
          return 'bg-purple-50 text-purple-700 border-purple-200';
        case 'Resolved':
          return 'bg-emerald-50 text-emerald-700 border-emerald-200';
        case 'Rejected':
          return 'bg-rose-50 text-rose-700 border-rose-200';
        default:
          return 'bg-slate-50 text-slate-700 border-slate-200';
      }
    }

    function getCategoryIcon(cat) {
      switch (cat) {
        case 'Road Damage': return '🚧';
        case 'Garbage Accumulation': return '🗑️';
        case 'Water Leakage': return '💧';
        case 'Blocked Drainage': return '🌊';
        case 'Broken Streetlights': return '💡';
        default: return '📋';
      }
    }

    // ==========================================
    // MAIN APP WITH PROFESSIONAL SIDEBAR & ROUTER
    // ==========================================
    function App() {
      // Routing state: 'home', 'submit', 'track', 'login', 'dashboard', 'details', 'analytics'
      const [currentPage, setCurrentPage] = useState('home');
      const [currentParam, setCurrentParam] = useState(''); // e.g. complaint ID for track or details
      const [mobileSidebarOpen, setMobileSidebarOpen] = useState(false);
      const [backendModalOpen, setBackendModalOpen] = useState(false);
      const [customApiUrl, setCustomApiUrl] = useState(localStorage.getItem('CIVIC_BACKEND_URL') || '');

      const [currentUser, setCurrentUser] = useState(null);
      const [token, setToken] = useState(localStorage.getItem('civic_token') || '');
      const [toast, setToast] = useState(null);

      const showToast = (message, type = 'info') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4500);
      };

      // Hash-based navigation synchronization
      useEffect(() => {
        const handleHashChange = () => {
          const hash = window.location.hash.replace('#/', '').replace('#', '');
          const parts = hash.split('/');
          const page = parts[0] || 'home';
          const param = parts[1] || '';
          
          if (['home', 'submit', 'track', 'login', 'dashboard', 'details', 'analytics'].includes(page)) {
            setCurrentPage(page);
            setCurrentParam(param);
          } else {
            setCurrentPage('home');
          }
        };

        handleHashChange();
        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      const navigate = (page, param = '') => {
        if (param) {
          window.location.hash = `#/${page}/${param}`;
        } else {
          window.location.hash = `#/${page}`;
        }
        setMobileSidebarOpen(false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // Verify token & user
      useEffect(() => {
        if (token) {
          fetch(`${API_BASE}/auth/me`, {
            headers: { 'Authorization': `Bearer ${token}` }
          })
          .then(res => res.ok ? safeJson(res) : null)
          .then(data => {
            if (data && data.user) {
              setCurrentUser(data.user);
            } else {
              localStorage.removeItem('civic_token');
              setToken('');
              setCurrentUser(null);
            }
          })
          .catch(() => {});
        }
      }, [token]);

      const handleLoginSuccess = (user, authToken) => {
        setCurrentUser(user);
        setToken(authToken);
        localStorage.setItem('civic_token', authToken);
        showToast(`Welcome back, ${user.name}!`, 'success');
        if (user.role === 'staff') {
          navigate('dashboard');
        } else {
          navigate('submit');
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setToken('');
        localStorage.removeItem('civic_token');
        showToast('Logged out successfully.', 'info');
        navigate('home');
      };

      return (
        <div className="min-h-screen flex bg-slate-50">
          {/* BACKEND CONNECTION MODAL */}
          {backendModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 animate-scale-in">
                <div className="flex justify-between items-center mb-3">
                  <div className="flex items-center gap-2.5">
                    <div className="w-8 h-8 rounded-xl bg-blue-100 text-blue-700 flex items-center justify-center">
                      <LucideIcon name="server" className="w-4 h-4" />
                    </div>
                    <h3 className="font-bold text-base text-slate-900">Backend Server Connection</h3>
                  </div>
                  <button onClick={() => setBackendModalOpen(false)} className="text-slate-400 hover:text-slate-600 text-lg">✕</button>
                </div>

                <p className="text-xs text-slate-500 mb-4 leading-relaxed">
                  {isGitHubPages
                    ? "Your portal is hosted on GitHub Pages. It currently runs via the built-in Intelligent Civic Engine with complete local persistence. If you have deployed the Flask backend (on Render, Railway, etc.), you can connect it here."
                    : "Connected directly to the local Python Flask backend on http://127.0.0.1:5000."}
                </p>

                <div className="space-y-2 mb-5">
                  <label className="block text-xs font-bold text-slate-700">Remote Flask API URL</label>
                  <input
                    type="url"
                    placeholder="e.g. https://civic-complaint-system.onrender.com"
                    value={customApiUrl}
                    onChange={(e) => setCustomApiUrl(e.target.value)}
                    className="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-xs bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono"
                  />
                  <p className="text-[11px] text-slate-400">
                    Leave blank to use the autonomous in-browser engine on GitHub Pages.
                  </p>
                </div>

                <div className="flex gap-2">
                  <button
                    onClick={() => {
                      if (customApiUrl.trim()) {
                        localStorage.setItem('CIVIC_BACKEND_URL', customApiUrl.trim());
                      } else {
                        localStorage.removeItem('CIVIC_BACKEND_URL');
                      }
                      setBackendModalOpen(false);
                      window.location.reload();
                    }}
                    className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs shadow-sm transition-all"

                    Save & Reconnect

                      localStorage.removeItem('CIVIC_BACKEND_URL');
                      setCustomApiUrl('');
                      setBackendModalOpen(false);
                      window.location.reload();
                    }}

                    Reset

              toast.type === 'error' ? 'bg-rose-600 text-white border-rose-500' :
              toast.type === 'warning' ? 'bg-amber-500 text-white border-amber-400' :
              'bg-slate-900 text-white border-slate-700'

              <span>{toast.message}</span>
              <button onClick={() => setToast(null)} className="ml-2 hover:opacity-75">✕</button>

              <div className="w-11 h-11 rounded-xl bg-gradient-to-br from-blue-500 to-civic-700 flex items-center justify-center text-white shadow-lg border border-blue-400/30">
                <LucideIcon name="building" className="w-6 h-6 text-white" />
              </div>
              <div>
                <div className="flex items-center gap-1.5">
                  <h1 className="font-bold text-base tracking-tight text-white">CivicResolve AI</h1>
                  <span className="bg-blue-500/20 text-blue-300 text-[9px] font-bold px-1.5 py-0.5 rounded uppercase">Gov 2.0</span>
                </div>
                <p className="text-[11px] text-slate-300 font-medium">Smart Prioritization Portal</p>
              </div>
            </div>

            {/* Navigation Links */}
            <nav className="flex-1 p-4 space-y-6 overflow-y-auto">
              <div>
                <div className="text-[10px] font-bold uppercase tracking-wider text-slate-400 px-3 mb-2">
                  Public Citizen Services
                </div>
                <div className="space-y-1">
                  <button
                    onClick={() => navigate('home')}
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                      currentPage === 'home' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-300 hover:text-white hover:bg-civic-900'
                    }`}
                  >
                    <LucideIcon name="home" className="w-4 h-4" />
                    <span>Home Overview</span>
                  </button>

                  <button
                    onClick={() => navigate('submit')}

                  >

    // ==========================================
    // 2. CITIZEN COMPLAINT FORM PAGE
    // ==========================================
    function ComplaintFormPage({ navigate, currentUser, showToast }) {
      const [title, setTitle] = useState('');
      const [description, setDescription] = useState('');
      const [category, setCategory] = useState('auto');
      const [location, setLocation] = useState('');
      const [landmark, setLandmark] = useState('');
      const [citizenName, setCitizenName] = useState(currentUser?.name || '');
      const [citizenEmail, setCitizenEmail] = useState(currentUser?.email || '');
      const [citizenPhone, setCitizenPhone] = useState(currentUser?.phone || '');
      const [imageFile, setImageFile] = useState(null);
      const [imagePreview, setImagePreview] = useState(null);
      const [submitting, setSubmitting] = useState(false);

      // AI Preview
      const [aiPreview, setAiPreview] = useState(null);
      const [aiLoading, setAiLoading] = useState(false);

      // Submission Confirmation Modal
      const [submittedComplaint, setSubmittedComplaint] = useState(null);

      // Live debounced AI evaluation
      useEffect(() => {
        if (!title.trim() && !description.trim()) {
          setAiPreview(null);
          return;
        }

        const timer = setTimeout(async () => {
          setAiLoading(true);
          try {
            const res = await fetch(`${API_BASE}/complaints/preview`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                title,
                description,
                category: category === 'auto' ? '' : category,
                location,
                landmark
              })
            });
            if (res.ok) {
              const data = await safeJson(res);
              setAiPreview(data);
            }
          } catch (e) {
            console.error(e);
          } finally {
            setAiLoading(false);
          }
        }, 400);

        return () => clearTimeout(timer);
      }, [title, description, category, location, landmark]);

      const handleImageChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          setImageFile(file);
          setImagePreview(URL.createObjectURL(file));
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!title.trim() || !description.trim() || !location.trim()) {
          showToast('Please fill in title, description, and location.', 'warning');
          return;
        }

        setSubmitting(true);
        try {
          const formData = new FormData();
          formData.append('title', title);
          formData.append('description', description);
          if (category !== 'auto') formData.append('category', category);
          formData.append('location', location);
          formData.append('landmark', landmark);
          formData.append('citizen_name', citizenName);
          formData.append('citizen_email', citizenEmail);
          formData.append('citizen_phone', citizenPhone);
          if (imageFile) formData.append('image', imageFile);

          const res = await fetch(`${API_BASE}/complaints`, {
            method: 'POST',
            body: formData
          });
          const data = await safeJson(res);
          if (!res.ok) throw new Error(data.error || 'Submission failed');

          setSubmittedComplaint(data);
          showToast(`Complaint ${data.complaint_id} submitted successfully!`, 'success');
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start animate-fade-in">
          {/* LEFT: CITIZEN COMPLAINT FORM */}
          <div className="lg:col-span-7 bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
            <div className="mb-6">
              <h2 className="text-xl font-bold text-slate-900 tracking-tight">Citizen Grievance Submission</h2>
              <p className="text-xs text-slate-500 mt-1">
                Report a municipal issue. Our NLP model will classify it and calculate its priority index in real time.
              </p>
            </div>

            <form onSubmit={handleSubmit} className="space-y-5">
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                  Complaint Title *
                </label>
                <input
                  type="text"
                  required
                  placeholder="e.g. Broken streetlight with exposed live sparking wire"
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  className="w-full px-4 py-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                />
              </div>

              <div>
                <div className="flex justify-between items-center mb-1.5">
                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider">
                    Detailed Description *
                  </label>
                  <span className="text-[11px] text-slate-400">Describe risk, duration, or impact</span>
                </div>
                <textarea
                  rows="4"
                  required
                  placeholder="Provide complete details (e.g. High voltage wire dangling outside elementary school gate after storm, risk of electric shock)..."
                  value={description}
                  onChange={(e) => setDescription(e.target.value)}
                  className="w-full px-4 py-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                ></textarea>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Category Selection
                  </label>
                  <select
                    value={category}
                    onChange={(e) => setCategory(e.target.value)}
                    className="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none font-medium"
                  >
                    <option value="auto">✨ AI Auto-Classification (NLP)</option>
                    {CATEGORIES.map(c => (
                      <option key={c} value={c}>{getCategoryIcon(c)} {c}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Location / Address *
                  </label>
                  <input
                    type="text"
                    required
                    placeholder="e.g. 4th Cross, Gandhi Road"
                    value={location}
                    onChange={(e) => setLocation(e.target.value)}
                    className="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                  Nearby Landmark (Helps Priority & Impact Scoring)
                </label>
                <input
                  type="text"
                  placeholder="e.g. Near St. Mary School, Opposite Metro Station, Beside Apex Hospital"
                  value={landmark}
                  onChange={(e) => setLandmark(e.target.value)}
                  className="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                />
              </div>

              {/* IMAGE EVIDENCE DROPZONE */}
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                  Upload Image Evidence (Optional)
                </label>
                <div className="flex items-center gap-4">
                  <label className="flex-1 border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-xl p-4 text-center cursor-pointer transition-colors bg-slate-50 hover:bg-blue-50/40">
                    <input
                      type="file"
                      accept="image/*"
                      onChange={handleImageChange}
                      className="hidden"
                    />
                    <div className="flex flex-col items-center gap-1">
                      <LucideIcon name="camera" className="w-6 h-6 text-slate-500" />
                      <span className="text-xs font-semibold text-slate-700">Click to upload photo evidence</span>
                      <span className="text-[10px] text-slate-400">PNG, JPG, WEBP up to 16MB</span>
                    </div>
                  </label>

                  {imagePreview && (
                    <div className="relative w-24 h-24 rounded-xl overflow-hidden border border-slate-300 shadow-xs flex-shrink-0">
                      <img src={imagePreview} alt="Preview" className="w-full h-full object-cover" />
                      <button
                        type="button"
                        onClick={() => { setImageFile(null); setImagePreview(null); }}
                        className="absolute top-1 right-1 bg-black/70 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs hover:bg-black"
                      >
                        ✕
                      </button>
                    </div>
                  )}
                </div>
              </div>

              {/* Citizen Contact Fields */}
              <div className="pt-2 border-t border-slate-100">
                <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-2">
                  Citizen Contact (For Verification & SMS Updates)
                </span>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <input
                    type="text"
                    placeholder="Citizen Name"
                    value={citizenName}
                    onChange={(e) => setCitizenName(e.target.value)}
                    className="px-3 py-2 border border-slate-300 rounded-lg text-xs"
                  />
                  <input
                    type="email"
                    placeholder="Citizen Email"
                    value={citizenEmail}
                    onChange={(e) => setCitizenEmail(e.target.value)}
                    className="px-3 py-2 border border-slate-300 rounded-lg text-xs"
                  />
                  <input
                    type="tel"
                    placeholder="Phone (Optional)"
                    value={citizenPhone}
                    onChange={(e) => setCitizenPhone(e.target.value)}
                    className="px-3 py-2 border border-slate-300 rounded-lg text-xs"
                  />
                </div>
              </div>

              <button
                type="submit"
                disabled={submitting}
                className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md hover:shadow-blue-600/30 transition-all text-sm flex items-center justify-center gap-2"
              >
                {submitting ? (
                  <span>Submitting & Analyzing with AI...</span>
                ) : (
                  <>
                    <LucideIcon name="filePlus" className="w-4 h-4" />
                    <span>Submit Complaint</span>
                  </>
                )}
              </button>
            </form>
          </div>

          {/* RIGHT: LIVE AI DIAGNOSTIC PREVIEW */}
          <div className="lg:col-span-5 space-y-5">
            <div className="bg-gradient-to-br from-slate-900 to-civic-950 text-white rounded-2xl shadow-xl p-6 border border-slate-800">
              <div className="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
                <div className="flex items-center gap-2">
                  <span className="text-lg">🤖</span>
                  <h3 className="font-bold text-sm tracking-wide text-white uppercase">Live AI Assessment</h3>
                </div>
                {aiLoading ? (
                  <span className="text-[11px] text-blue-400 animate-pulse font-medium">Analyzing NLP...</span>
                ) : (
                  <span className="text-[10px] bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded-full border border-blue-400/30 font-mono">
                    Scikit-Learn Ready
                  </span>
                )}
              </div>

              {aiPreview ? (
                <div className="space-y-4">
                  {/* Category Prediction */}
                  <div className="bg-slate-800/80 rounded-xl p-4 border border-slate-700/80">
                    <div className="text-[11px] text-slate-400 font-medium mb-1">Predicted Category:</div>
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <span className="text-xl">{getCategoryIcon(aiPreview?.ai_classification?.predicted_category || aiPreview?.predicted_category || 'Road Damage')}</span>
                        <span className="font-bold text-sm text-white">
                          {aiPreview?.ai_classification?.predicted_category || aiPreview?.predicted_category || 'Assessing...'}
                        </span>
                      </div>
                      <span className="text-xs font-mono font-bold text-emerald-400 bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-500/30">
                        {aiPreview?.ai_classification?.confidence || aiPreview?.category_confidence || 85}% Confident
                      </span>
                    </div>

                    <div className="w-full bg-slate-700 h-1.5 rounded-full mt-2.5 overflow-hidden">
                      <div
                        className="bg-emerald-400 h-full rounded-full transition-all duration-500"
                        style={{ width: `${Math.min(100, Math.max(15, aiPreview?.ai_classification?.confidence || aiPreview?.category_confidence || 85))}%` }}
                      ></div>
                    </div>
                  </div>

                  {/* Priority Breakdown */}
                  <div className="bg-slate-800/80 rounded-xl p-4 border border-slate-700/80">
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-[11px] text-slate-400 font-medium">Priority Prediction:</span>
                      <span className={`text-xs font-extrabold px-2.5 py-0.5 rounded-full ${
                        (aiPreview?.priority_assessment?.priority || aiPreview?.priority) === 'Critical' ? 'bg-red-500 text-white' :
                        (aiPreview?.priority_assessment?.priority || aiPreview?.priority) === 'High' ? 'bg-orange-500 text-white' :
                        (aiPreview?.priority_assessment?.priority || aiPreview?.priority) === 'Medium' ? 'bg-amber-500 text-white' :
                        'bg-blue-600 text-white'
                      }`}>
                        {aiPreview?.priority_assessment?.priority || aiPreview?.priority || 'Medium'} ({aiPreview?.priority_assessment?.priority_score || aiPreview?.priority_score || 50}/100)
                      </span>
                    </div>

                    <div className="grid grid-cols-2 gap-2 text-[11px] text-slate-300 font-mono mt-3">
                      <div className="bg-slate-900/80 p-2 rounded-lg border border-slate-700">
                        <div className="text-slate-400 text-[10px]">Safety Risk</div>
                        <div className="font-bold text-red-400">{aiPreview?.priority_assessment?.safety_score ?? (aiPreview?.sub_scores?.safety_risk ?? 8.0)} / 35</div>
                      </div>
                      <div className="bg-slate-900/80 p-2 rounded-lg border border-slate-700">
                        <div className="text-slate-400 text-[10px]">Severity</div>
                        <div className="font-bold text-amber-400">{aiPreview?.priority_assessment?.severity_score ?? (aiPreview?.sub_scores?.severity ?? 7.0)} / 25</div>
                      </div>
                      <div className="bg-slate-900/80 p-2 rounded-lg border border-slate-700">
                        <div className="text-slate-400 text-[10px]">Public Impact</div>
                        <div className="font-bold text-blue-400">{aiPreview?.priority_assessment?.impact_score ?? (aiPreview?.sub_scores?.public_impact ?? 7.5)} / 25</div>
                      </div>
                      <div className="bg-slate-900/80 p-2 rounded-lg border border-slate-700">
                        <div className="text-slate-400 text-[10px]">Waiting Time</div>
                        <div className="font-bold text-purple-400">{aiPreview?.priority_assessment?.waiting_score ?? (aiPreview?.sub_scores?.waiting_time ?? 2.0)} / 15</div>
                      </div>
                    </div>

                    <p className="text-[11px] text-slate-300 mt-3 italic border-t border-slate-700/60 pt-2 leading-relaxed">
                      "{aiPreview?.priority_assessment?.priority_reason || aiPreview?.priority_reason || 'Multi-factor priority score calculated.'}"
                    </p>
                  </div>

                  {/* Duplicate Detection Alert */}
                  {Boolean(aiPreview?.duplicate_detection?.is_duplicate_likely || aiPreview?.duplicate_detection?.is_duplicate || aiPreview?.is_duplicate) && (
                    <div className="bg-amber-950/70 border border-amber-500/50 rounded-xl p-3.5 text-xs text-amber-200">
                      <div className="font-bold flex items-center gap-1.5 text-amber-400 mb-1">
                        <LucideIcon name="alertTriangle" className="w-4 h-4" />
                        <span>Potential Duplicate Complaint Detected</span>
                      </div>
                      <p className="text-[11px] leading-relaxed">
                        A matching complaint exists: <strong>{aiPreview?.duplicate_detection?.top_match?.complaint_id || aiPreview?.duplicate_detection?.similar_complaint_id || 'Existing Ticket'}</strong> ({aiPreview?.duplicate_detection?.top_similarity || aiPreview?.duplicate_detection?.similarity_percentage || 80}% match).
                        Staff will review this report alongside existing tickets.
                      </p>
                    </div>
                  )}
                </div>
              ) : (
                <div className="text-center py-8 text-slate-400 text-xs">
                  <div className="text-3xl mb-2 opacity-60">🧠</div>
                  <p>Type in your complaint title and description to preview instant NLP category prediction and priority scoring.</p>
                </div>
              )}
            </div>
          </div>

          {/* SUBMISSION CONFIRMATION MODAL */}
          {submittedComplaint && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 sm:p-8 border border-slate-100 text-center animate-scale-in">
                <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">
                  ✓
                </div>
                <h3 className="text-2xl font-bold text-slate-900">Complaint Registered!</h3>
                <p className="text-xs text-slate-500 mt-1">
                  Your grievance has been indexed into the municipal triage database.
                </p>

                <div className="my-6 bg-slate-50 border-2 border-dashed border-slate-300 rounded-xl p-4 flex items-center justify-between">
                  <div className="text-left">
                    <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider block">Complaint ID</span>
                    <span className="text-lg font-mono font-extrabold text-blue-700">
                      {submittedComplaint.complaint_id}
                    </span>
                  </div>
                  <button
                    onClick={() => {
                      navigator.clipboard.writeText(submittedComplaint.complaint_id);
                      showToast('Complaint ID copied to clipboard!', 'info');
                    }}
                    className="bg-white hover:bg-slate-100 border border-slate-300 text-slate-700 text-xs font-semibold px-3 py-1.5 rounded-lg shadow-xs"
                  >
                    Copy ID
                  </button>
                </div>

                <div className="grid grid-cols-2 gap-3 text-left mb-6 text-xs bg-slate-50 p-3 rounded-xl border border-slate-200">
                  <div>
                    <span className="text-slate-400 block text-[10px]">Category</span>
                    <span className="font-bold text-slate-800">{submittedComplaint.category}</span>
                  </div>
                  <div>
                    <span className="text-slate-400 block text-[10px]">Priority</span>
                    <span className={`inline-block font-extrabold px-2 py-0.5 rounded text-[11px] ${getPriorityBadge(submittedComplaint.priority)}`}>
                      {submittedComplaint.priority} ({submittedComplaint.priority_score} pts)
                    </span>
                  </div>
                </div>

                <div className="flex gap-3">
                  <button
                    onClick={() => {
                      const id = submittedComplaint.complaint_id;
                      setSubmittedComplaint(null);
                      navigate('track', id);
                    }}
                    className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl text-xs sm:text-sm shadow-md"
                  >
                    Track Progress
                  </button>
                  <button
                    onClick={() => {
                      setSubmittedComplaint(null);
                      setTitle('');
                      setDescription('');
                      setLocation('');
                      setLandmark('');
                      setImageFile(null);
                      setImagePreview(null);
                    }}
                    className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2.5 rounded-xl text-xs sm:text-sm"
                  >
                    Submit Another
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 3. COMPLAINT TRACKING PAGE
    // ==========================================
    function ComplaintTrackingPage({ initialId, navigate, showToast }) {
      const [searchId, setSearchId] = useState(initialId || '');
      const [complaint, setComplaint] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const fetchTracking = async (idToSearch) => {
        const id = (idToSearch || searchId).trim();
        if (!id) return;
        setLoading(true);
        setError('');

        try {
          const res = await fetch(`${API_BASE}/complaints/track/${id}`);
          const data = await safeJson(res);
          if (!res.ok) throw new Error(data.error || 'Complaint not found');
          setComplaint(data.complaint);
        } catch (err) {
          setError(err.message);
          setComplaint(null);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        if (initialId) {
          fetchTracking(initialId);
        }
      }, [initialId]);

      const steps = ['Pending', 'Verified', 'In Progress', 'Resolved'];
      const currentStepIdx = complaint ? steps.indexOf(complaint.status) : -1;
      const isRejected = complaint?.status === 'Rejected';

      return (
        <div className="max-w-4xl mx-auto space-y-8 animate-fade-in">
          {/* SEARCH BOX */}
          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
            <h2 className="text-xl font-bold text-slate-900 tracking-tight mb-2">Track Grievance Status</h2>
            <p className="text-xs text-slate-500 mb-6">
              Enter your unique Complaint ID (e.g. CIVIC-2026-1001) to view real-time field status and history.
            </p>

            <form onSubmit={(e) => { e.preventDefault(); fetchTracking(); }} className="flex gap-3">
              <input
                type="text"
                placeholder="Enter Complaint ID (e.g. CIVIC-2026-1001)"
                value={searchId}
                onChange={(e) => setSearchId(e.target.value)}
                className="flex-1 px-4 py-3 border border-slate-300 rounded-xl text-sm font-mono focus:ring-2 focus:ring-blue-500 focus:outline-none uppercase"
              />
              <button
                type="submit"
                disabled={loading}
                className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-xl transition-all shadow-md text-sm flex items-center gap-1.5"
              >
                <LucideIcon name="search" className="w-4 h-4" />
                <span>{loading ? 'Searching...' : 'Track'}</span>
              </button>
            </form>

            {/* Quick Sample IDs */}
            <div className="mt-4 flex flex-wrap items-center gap-2 text-xs text-slate-500">
              <span>Try sample complaints:</span>
              {['CIVIC-2026-1001', 'CIVIC-2026-1002', 'CIVIC-2026-1003', 'CIVIC-2026-1008'].map(sid => (
                <button
                  key={sid}
                  type="button"
                  onClick={() => { setSearchId(sid); fetchTracking(sid); }}
                  className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-mono text-[11px] px-2.5 py-1 rounded-md"
                >
                  {sid}
                </button>
              ))}
            </div>

            {error && (
              <div className="mt-4 p-4 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl font-medium">
                {error}
              </div>
            )}
          </div>

          {/* COMPLAINT DETAILS & STEPPER TIMELINE */}
          {complaint && (
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 space-y-8 animate-fade-in">
              {/* Header */}
              <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-4 pb-6 border-b border-slate-200">
                <div>
                  <div className="flex items-center gap-2 mb-1">
                    <span className="font-mono font-bold text-sm text-blue-700">{complaint.complaint_id}</span>
                    <span className={`text-xs font-semibold px-2.5 py-0.5 rounded-full border ${getStatusBadge(complaint.status)}`}>
                      {complaint.status}
                    </span>
                    <span className={`text-xs font-extrabold px-2.5 py-0.5 rounded-full ${getPriorityBadge(complaint.priority)}`}>
                      {complaint.priority} ({complaint.priority_score} pts)
                    </span>
                  </div>
                  <h3 className="text-lg font-bold text-slate-900">{complaint.title}</h3>
                  <p className="text-xs text-slate-500 mt-0.5">
                    📍 {complaint.location} {complaint.landmark && `(Near ${complaint.landmark})`}
                  </p>
                </div>

                <div className="text-right text-xs text-slate-400">
                  <div>Submitted on</div>
                  <div className="font-medium text-slate-700">{complaint.created_at}</div>
                </div>
              </div>

              {/* TIMELINE PROGRESS STEPPER */}
              <div>
                <h4 className="text-xs font-bold text-slate-700 uppercase tracking-wider mb-6">Resolution Progress</h4>
                {isRejected ? (
                  <div className="bg-rose-50 border border-rose-200 rounded-xl p-4 text-xs text-rose-700">
                    <strong>Complaint Rejected:</strong> This issue was marked outside municipal jurisdiction or invalid.
                  </div>
                ) : (
                  <div className="relative">
                    <div className="absolute top-4 left-6 right-6 h-1 bg-slate-200 -z-0 hidden sm:block">
                      <div
                        className="bg-blue-600 h-1 transition-all duration-500"
                        style={{ width: `${Math.max(0, currentStepIdx / (steps.length - 1)) * 100}%` }}
                      ></div>
                    </div>

                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 relative z-10">
                      {steps.map((st, idx) => {
                        const isDone = idx <= currentStepIdx;
                        const isCurrent = idx === currentStepIdx;
                        return (
                          <div key={st} className="flex flex-col items-center text-center">
                            <div className={`w-9 h-9 rounded-full flex items-center justify-center font-bold text-xs mb-2 transition-all ${
                              isDone ? 'bg-blue-600 text-white ring-4 ring-blue-100 shadow-md' : 'bg-slate-200 text-slate-500'
                            }`}>
                              {isDone ? '✓' : idx + 1}
                            </div>
                            <span className={`text-xs font-bold ${isCurrent ? 'text-blue-700 font-extrabold' : isDone ? 'text-slate-800' : 'text-slate-400'}`}>
                              {st}
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>

              {/* Description & Photo */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6 pt-6 border-t border-slate-100">
                <div className="md:col-span-2 space-y-4">
                  <div>
                    <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Description</span>
                    <p className="text-sm text-slate-700 leading-relaxed bg-slate-50 p-4 rounded-xl border border-slate-200">
                      {complaint.description}
                    </p>
                  </div>

                  <div className="bg-blue-50/70 border border-blue-200 rounded-xl p-4 text-xs">
                    <span className="font-bold text-blue-900 block mb-1">🤖 AI Priority Rationale:</span>
                    <p className="text-blue-800 leading-relaxed">{complaint.priority_reason}</p>
                  </div>
                </div>

                {complaint.image_url ? (
                  <div>
                    <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Attached Photo</span>
                    <div className="rounded-xl overflow-hidden border border-slate-200 shadow-sm">
                      <img src={complaint.image_url} alt="Evidence" className="w-full h-44 object-cover" />
                    </div>
                  </div>
                ) : (
                  <div className="bg-slate-50 rounded-xl border border-dashed border-slate-200 p-4 flex flex-col items-center justify-center text-slate-400 text-xs text-center">
                    <LucideIcon name="camera" className="w-6 h-6 mb-1" />
                    <span>No image attached</span>
                  </div>
                )}
              </div>

              {/* AUDIT LOG TIMELINE */}
              <div className="pt-6 border-t border-slate-100">
                <h4 className="text-xs font-bold text-slate-700 uppercase tracking-wider mb-4">Official Action & Audit Trail</h4>
                <div className="space-y-3">
                  {complaint.history && complaint.history.map((h, i) => (
                    <div key={i} className="flex items-start gap-3 p-3.5 bg-slate-50 rounded-xl border border-slate-200 text-xs">
                      <div className="w-2 h-2 rounded-full bg-blue-500 mt-1.5 flex-shrink-0"></div>
                      <div className="flex-1">
                        <div className="flex justify-between items-center mb-1">
                          <span className="font-bold text-slate-800">
                            Status changed to <span className="text-blue-700">{h.new_status}</span> by {h.changed_by}
                          </span>
                          <span className="text-slate-400 text-[11px] font-mono">{h.created_at}</span>
                        </div>
                        {h.notes && <p className="text-slate-600 italic">"{h.notes}"</p>}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 4. STAFF LOGIN PAGE
    // ==========================================
    function StaffLoginPage({ onLoginSuccess, navigate, showToast }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [mode, setMode] = useState('staff'); // 'staff' or 'citizen' or 'register'
      const [name, setName] = useState('');
      const [phone, setPhone] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const fillDemo = (role) => {
        if (role === 'staff') {
          setEmail('staff@civic.gov');
          setPassword('staff123');
          setMode('staff');
        } else {
          setEmail('citizen@example.com');
          setPassword('citizen123');
          setMode('citizen');
        }
        setError('');
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);

        try {
          if (mode === 'register') {
            const res = await fetch(`${API_BASE}/auth/register`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name, email, password, phone, role: 'citizen' })
            });
            const data = await safeJson(res);
            if (!res.ok) throw new Error(data.error || 'Registration failed');
            onLoginSuccess(data.user, data.token);
          } else {
            const res = await fetch(`${API_BASE}/auth/login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, password })
            });
            const data = await safeJson(res);
            if (!res.ok) throw new Error(data.error || 'Invalid credentials');
            onLoginSuccess(data.user, data.token);
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="max-w-md mx-auto py-10 animate-fade-in">
          <div className="bg-white rounded-2xl shadow-xl border border-slate-200 p-6 sm:p-8">
            <div className="text-center mb-6">
              <div className="w-12 h-12 bg-blue-100 text-blue-700 rounded-xl flex items-center justify-center mx-auto mb-3 shadow-xs">
                <LucideIcon name="shield" className="w-6 h-6" />
              </div>
              <h2 className="text-xl font-bold text-slate-900">
                {mode === 'staff' ? 'Staff Official Login' : mode === 'register' ? 'Register Citizen Account' : 'Citizen Sign In'}
              </h2>
              <p className="text-xs text-slate-500 mt-1">
                Access municipal prioritization and complaint management tools
              </p>
            </div>

            {/* QUICK 1-CLICK DEMO BUTTONS */}
            <div className="bg-blue-50/80 border border-blue-200 rounded-xl p-3.5 mb-6 text-xs">
              <span className="font-bold text-blue-900 mb-1.5 block">⚡ 1-Click Demo Fill:</span>
              <div className="grid grid-cols-2 gap-2">
                <button
                  type="button"
                  onClick={() => fillDemo('staff')}
                  className="bg-white hover:bg-blue-100 border border-blue-300 text-blue-900 font-bold py-1.5 px-2 rounded-lg text-center shadow-xs transition-colors"
                >
                  🛡️ Staff Officer
                </button>
                <button
                  type="button"
                  onClick={() => fillDemo('citizen')}
                  className="bg-white hover:bg-blue-100 border border-blue-300 text-blue-900 font-bold py-1.5 px-2 rounded-lg text-center shadow-xs transition-colors"
                >
                  👤 Citizen Demo
                </button>
              </div>
            </div>

            {error && (
              <div className="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl font-medium">
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              {mode === 'register' && (
                <>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Full Name</label>
                    <input
                      type="text"
                      required
                      value={name}
                      onChange={(e) => setName(e.target.value)}
                      placeholder="e.g. Elena Rostova"
                      className="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Phone Number</label>
                    <input
                      type="text"
                      value={phone}
                      onChange={(e) => setPhone(e.target.value)}
                      placeholder="+1 (555) 000-0000"
                      className="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    />
                  </div>
                </>
              )}

              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
                <input
                  type="email"
                  required
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  placeholder="name@civic.gov"
                  className="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                <input
                  type="password"
                  required
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  placeholder="••••••••"
                  className="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                />
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl shadow-md transition-all text-sm mt-2"
              >
                {loading ? 'Authenticating...' : mode === 'register' ? 'Register' : 'Sign In'}
              </button>
            </form>

            <div className="mt-5 pt-4 border-t border-slate-100 flex justify-between text-xs text-slate-500">
              <button
                onClick={() => setMode(mode === 'staff' ? 'citizen' : 'staff')}
                className="text-blue-600 hover:underline"
              >
                Switch to {mode === 'staff' ? 'Citizen Login' : 'Staff Login'}
              </button>
              <button
                onClick={() => setMode(mode === 'register' ? 'citizen' : 'register')}
                className="text-slate-600 hover:underline font-medium"
              >
                {mode === 'register' ? 'Sign In Instead' : 'Register Citizen'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 5. STAFF DASHBOARD PAGE
    // ==========================================
    function StaffDashboardPage({ currentUser, token, navigate, showToast }) {
      const [complaints, setComplaints] = useState([]);
      const [summary, setSummary] = useState(null);
      const [loading, setLoading] = useState(true);

      // Filters
      const [search, setSearch] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('All');
      const [priorityFilter, setPriorityFilter] = useState('All');
      const [statusFilter, setStatusFilter] = useState('All');
      const [duplicateFilter, setDuplicateFilter] = useState('All');
      const [sortBy, setSortBy] = useState('priority_score');

      const fetchDashboardData = async () => {
        setLoading(true);
        try {
          const params = new URLSearchParams();
          if (search) params.append('search', search);
          if (categoryFilter !== 'All') params.append('category', categoryFilter);
          if (priorityFilter !== 'All') params.append('priority', priorityFilter);
          if (statusFilter !== 'All') params.append('status', statusFilter);
          if (duplicateFilter === 'Duplicates Only') params.append('is_duplicate', '1');
          if (duplicateFilter === 'Unique Only') params.append('is_duplicate', '0');
          params.append('sort_by', sortBy);

          const [compRes, sumRes] = await Promise.all([
            fetch(`${API_BASE}/staff/complaints?${params.toString()}`),
            fetch(`${API_BASE}/analytics/summary`)
          ]);

          const compData = await safeJson(compRes);
          const sumData = await safeJson(sumRes);

          setComplaints(compData.complaints || []);
          setSummary(sumData);
        } catch (e) {
          console.error(e);
          showToast('Failed to fetch staff complaints', 'error');
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchDashboardData();
      }, [search, categoryFilter, priorityFilter, statusFilter, duplicateFilter, sortBy]);

      const handleRecalculatePriorities = async () => {
        try {
          const authTok = token || localStorage.getItem('token');
          const res = await fetch(`${API_BASE}/staff/recalculate-priorities`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(authTok ? { 'Authorization': `Bearer ${authTok}` } : {})
            }
          });
          const data = await safeJson(res);
          if (!res.ok) throw new Error(data.error || 'Failed to recalculate priorities');
          showToast(data.message, 'success');
          fetchDashboardData();
        } catch (e) {
          showToast(e.message || 'Error recalculating aging priorities', 'error');
        }
      };

      return (
        <div className="space-y-8 animate-fade-in">
          {/* HEADER & QUICK ACTIONS */}
          <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-4">
            <div>
              <div className="flex items-center gap-2">
                <LucideIcon name="dashboard" className="w-5 h-5 text-blue-600" />
                <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Staff Triage Command Center</h2>
              </div>
              <p className="text-xs text-slate-500 mt-1">
