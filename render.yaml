services:
  - type: web
    name: civic-complaint-system
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir backend app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: FLASK_DEBUG
        value: 0
      - key: SECRET_KEY
        generateValue: true
